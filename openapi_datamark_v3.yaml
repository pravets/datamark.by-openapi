# =============================================================================
# ИЗВЕСТНЫЕ ОГРАНИЧЕНИЯ И НЕОДНОЗНАЧНОСТИ (по тексту исходного PDF)
# =============================================================================
# 1. Ответы об ошибках оформлены ключом `default` (OpenAPI 3.0.x не допускает
#    wildcard-ключи вида «4XX»); в description каждого такого ответа указано,
#    что это ошибка HTTP 4XX со схемой ErrorResponse.
# 2. Представления А/Б: в документе критерии выбора представления для ряда
#    методов не указаны или привязаны только к товарным группам/датам перехода
#    (например milk — с 10.10.2025, shoes/tires/clothes/perfum/photo/water —
#    с 01.06.2026). Представления оформлены отдельными операциями (пути /v2 и
#    /v3, суффиксы V2/V3 в operationId) либо через oneOf с пояснениями.
# 3. Условная обязательность полей («Да/Нет», «обязателен хотя бы один из»,
#    зависимость от значения другого поля) не выразима в OpenAPI 3.0 и
#    зафиксирована в description соответствующих полей.
# 4. В таблицах раздела 4.1 нет колонки обязательности полей объектов, поэтому
#    массивы `required` в схемах классов объектов не объявлены.
# 5. Несоответствия «таблица vs примеры» в документе сохранены как в источнике
#    (выбор зафиксирован в description), наиболее существенные:
#    - Agent.addres (таблица) vs address (все примеры) — в схеме использовано addres;
#    - поле status.name (п. 4.2.3.1) vs status.message (примеры методов);
#    - gtin_check: Boolean в 3.2.2/3.2.3, но число 0 в примере 3.2.4;
#    - count/price: Integer/Decimal в Представлении А vs String в Представлении Б;
#    - id заказа: «String, Integer» (oneOf); в примерах id — строки;
#    - is_rb_marked_argee (3.5.18): String по таблице, boolean в примере;
#    - truster_id: String по таблице, число в примерах.
# 6. Опечатки документа сохранены в enum/примерах как в источнике: `perfum`
#    (группа товаров), `tnttn` (тип документа), смешанный регистр
#    Usemark/usemark, ключ «сode» с кириллической «с» в справочнике ролей.
#    Явные синтаксические ошибки JSON в примерах PDF исправлены (с пометками).
# 7. Неполные перечни справочников: для CodeType, ParticipantRole, Country,
#    Currency, DocumentType, WriteoffReason документ приводит «некоторые
#    значения» — enum содержит только значения из документа (предупреждение
#    в description схем). Соответствие Country/Currency классификаторам
#    ISO 3166-1/ISO 4217 — предположение (документ явно не ссылается).
# 8. Параметры пагинации: где в документе указаны page/page_size — добавлены
#    default 15 / maximum 200; часть методов списков использует структуры
#    {count, *_list} вместо next/previous/results — сохранено как в документе.
# 9. /principalList: по документу «параметр Token в заголовке не используется»,
#    однако согласно заданию на операцию установлена security apiKey.
# 10. /downloads/{filename}: таблица ответа в документе отсутствует — ответ
#    application/octet-stream является допущением (метод скачивания файла).
# 11. Метод 3.9.1: «строка запроса» указана с префиксом /v3, пример — без;
#    принят вариант /v3/common/getUsersBillingPdfActsList.
# 12. Форматы дат в документе неоднородны (ISO 8601 и «YYYY-MM-DD HH:MM:SS+03»):
#    поля с датой и временем — format: date-time, поля только с датой —
#    format: date; неоднородность отражена в description.
# 13. Рекурсивные структуры (состав агрегата, Category.inner) раскрыты inline
#    на ограниченную глубину или через self-ref, где это возможно в OAS 3.0.
# 14. Символ-разделитель <GS> (ASCII 29) в кодах маркировки/агрегации в
#    примерах записан в экранированном виде \u001d, как принято в документе.
# 15. Отдельные недокументированные поля, встречающиеся только в примерах
#    (exporter_taxpayer_id, user_info_to/user_info_from и др.), добавлены
#    в схемы с пометками либо зафиксированы в description.
# =============================================================================
