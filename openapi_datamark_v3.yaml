  /v2/reports/addChangeOwnerMade:
    post:
      description: 'Метод «Отчёт о смене владельца» (п. 3.5.15). Для данного пути применяется Представление А (п. 3.5.15.1,
        API версии v2). Альтернативное Представление Б (п. 3.5.15.2, API версии v3) доступно по пути /v3/reports/addChangeOwnerMade
        и дополнительно позволяет передавать массив кодов агрегации (aggregates). Явная привязка товарных групп к представлениям
        в документе не указана: в примерах Представления А использована товарная группа shoes, в примерах Представления Б
        — dietary_supplements. Значение параметра reason определяет состав и обязательность заполнения отдельных атрибутов
        (см. примечания в описаниях полей).'
      operationId: createChangeOwnerReportV2
      requestBody:
        content:
          application/json; charset=utf-8:
            examples:
              variant1_reorganization:
                summary: Вариант 1. Смена владельца при реорганизации субъекта хозяйствования (reason = reorganization)
                value:
                  agent: 10564
                  document_date: '2024-09-30'
                  document_number: '5'
                  document_type: aktreorg
                  labels:
                  - "0104813420015020212viLoMo1TcYrk\x1D910005\x1D92JFcwk6KN9mYbzCVY3TMQqvh6V586x5rreGd4fQvG33TshvyXnnKoZfoiGfwA5X8h2Zyw8HBXPLoBtS9wwAswZAw4"
                  - "01048116440080642122urA5V4fFxZN\x1D910005\x1D92eTob8nQhDGvJKmXCUL1TKmhJvFJdxomU1eDiXskLPReM"
                  - AAA012345289
                  - AAA012345290
                  reason: reorganization
              variant2_change_owner_goods:
                summary: Вариант 2. Смена владельца маркированного товара (reason = change_owner_goods)
                value:
                  comment: ''
                  group: shoes
                  labels:
                  - "0104813420015020212KWrkJTRRcLcH\x1D910005\x1D92xD6TNtg4mviY2AWZnDF1NKNvK4ARuV8FsdLRAL6iBF5pVUm9MyJZ4gN9GBNB1rEHoxBFpcyyUnzp2vT4nojZbqd5"
                  - "0104813420015020212Q9GxPZWCw3ah\x1D910005\x1D92tUnujbqaRWfrEz7dyMvtymQW3RTmsz6qZiDnmCnxuW7MCoaLx8nF16b7C4JeRqGcnFu2ku3PBY4XNmr5ctsHfkTk"
                  reason: change_owner_goods
            schema:
              properties:
                agent:
                  description: 'ID контрагента-правопредшественника (прежнего владельца), которому ранее принадлежали неиспользованные
                    КМ, УКЗ, ЗЗ и/или ЗМН. Примечания: 1. Указывается значение реквизита id объекта класса Agent (см. п. 4.1.2).
                    2. Должен иметь признак зарегистрированного участника оборота товаров (is_verified = True). Примечание:
                    Обязательно указывается только если причина смены владельца – реорганизация субъекта хозяйствования (reason
                    = reorganization). В иных случаях не используется.'
                  type: integer
                comment:
                  description: Комментарий, примечание
                  type: string
                document_date:
                  description: 'Дата документа-основания. Формат: YYYY-MM-DD. Примечание: Обязательно, если причина смены
                    владельца reason = reorganization. Может быть заполнено в иных случаях.'
                  format: date
                  type: string
                document_number:
                  description: Номер документа-основания
                  type: string
                document_type:
                  description: 'Вид документа-основания. Код значения перечисления shippingDocs, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.3). Допустимые значения: aktreorg – акт передачи;
                    ttn – товарно-транспортная накладная (ТТН); tnttn – товарная накладная (ТН); ettn – электронная товарно-транспортная
                    накладная (эТТН); etn – электронная товарная накладная (эТН). Примечание: Обязательно, если причина смены
                    владельца reason = reorganization. Может быть заполнено в иных случаях.'
                  enum:
                  - aktreorg
                  - ttn
                  - tnttn
                  - ettn
                  - etn
                  type: string
                group:
                  description: 'Товарная группа (перечень значений приведен таблице 4.2.1.2). Примечание: Обязательно указывается
                    только если выполняется смена владельца маркированного товара (reason = change_owner_goods). В иных случаях
                    не используется.'
                  type: string
                labels:
                  description: 'Массив КМ или серий и номеров бланков (знаков), подлежащих передаче новому владельцу. Ограничения:
                    1. Не более 100 000 КМ или знаков на 1 запрос; 2. КМ или знаки должны быть одного типа LabelType (см.
                    п. 4.2.2); 3. При смене владельца в случае реорганизации субъекта хозяйствования (reason = reorganization):
                    3.1. КМ или знаки должны принадлежать прежнему владельцу, указанному в атрибуте agent; 3.2. КМ или знаки
                    не должны быть использованными для маркировки товара или списанными (status.code < 50); 4. При смене владельца
                    маркированного товара (reason = change_owner_goods): 4.1. КМ или знаки должны быть из одной товарной группы
                    Group (см. п. 4.2.1); 4.2. КМ или знаки использованы для маркировки товара и товар находятся в обороте
                    (status.code = 50 или 55).'
                  items:
                    description: КМ или серия и номер бланка (знака)
                    type: string
                  maxItems: 100000
                  type: array
                reason:
                  description: 'Причина смены владельца. Код значения перечисления change_of_owner, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.7): reorganization – реорганизация; change_owner_goods
                    – смена владельца товара. Примечание: Значение параметра определяет состав и обязательность заполнения
                    отдельных атрибутов.'
                  enum:
                  - reorganization
                  - change_owner_goods
                  type: string
              required:
              - reason
              - labels
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                report_id: 7ce6e142-7786-48f9-b99c-cbb25446ad73
              schema:
                properties:
                  report_id:
                    description: UID, уникальный идентификатор отчёта о смене владельца (report_type = 15)
                    type: string
                type: object
          description: Успешное выполнение запроса
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Отчёт о смене владельца (Представление А)
      tags:
      - Отчеты
