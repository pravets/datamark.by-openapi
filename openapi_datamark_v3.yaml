# =============================================================================
# ГИС «Электронный знак» — API маркировки и оборота товаров
# OpenAPI 3.0.3 спецификация (YAML)
#
# Источник: «Web-сервис межсистемного взаимодействия. Спецификация API.
# Маркировка и оборот товаров», редакция 4.25, РУП «Издательство «Белбланкавыд».
# Документация: https://datamark.by/dokumenti/
#
# Сгенерировано автоматической конвертацией PDF-документа (286 стр.) в OpenAPI.
# Проверено: валидатор openapi-spec-validator (OpenAPI 3.0.3) — без ошибок;
# все $ref разрешаются; operationId уникальны (camelCase); security применена
# ко всем операциям, кроме /auth.
#
# Охват: 96 операций, 31 схема components/schemas (13 классов объектов
# раздела 4.1 + 17 справочников/перечислений разделов 4.2–4.3 + ErrorResponse).
# =============================================================================

components:
  schemas:
    Agent:
      description: Объект «Контрагент» (класс Agent, п. 4.1.2)
      example:
        address: г. Минск,ул. Тимирязева, д.2, ком. 16
        country: '112'
        gln: '4811612900000'
        id: 129
        is_rules_agree: true
        name: СООО "Свиток"
        status: 1
        substituted: false
        unp: '190704463'
      properties:
        addres:
          description: Адрес контрагента
          type: string
        country:
          description: Страна регистрации контрагента. Код значения перечисления country, полученного методом /directories/{:code}
            (п. 3.8.3; перечень значений — таблица 4.3.1)
          oneOf:
          - description: Код значения перечисления country
            type: string
          - description: Элемент перечисления country
            properties:
              code:
                description: Код (идентификатор) элемента
                type: string
              comment:
                description: Примечание, комментарий
                nullable: true
                type: string
              name:
                description: Значение элемента
                type: string
            type: object
        gln:
          description: GLN контрагента
          nullable: true
          type: string
        id:
          description: 'Код (идентификатор) контрагента. Примечание: в параметре user_to объекта класса Ship указанный атрибут
            поименован как "agent"'
          type: integer
        is_rules_agree:
          description: 'Признак ознакомления и принятия условий публичного договора с Оператором на реализацию СИ и оказания
            услуг по предоставлению и учёту КМ в ГИС «Электронный знак» (факт присоединения к публичному договору): True –
            да; False – нет'
          type: boolean
        is_verified:
          description: 'Признак участника оборота товаров, зарегистрированного в ГИС «Электронный знак»: True – является участником
            оборота товаров; False – не является участником оборота товаров'
          type: boolean
        name:
          description: Наименование контрагента
          type: string
        status:
          description: Статус контрагента. Признак активной, т.е. «включенной» (status.code = 1), или заблокированной, т.е.
            «отключенной» (status.code = 0), записи
          properties:
            code:
              description: Код статуса
              type: string
            message:
              description: Наименование статуса
              type: string
          type: object
        substituted:
          description: 'Признак работы за другого участника: True – операции в ГИС «Электронный знак» осуществляются Поверенным
            в интересах и по поручению другого участника оборота (Доверителя); False – операции осуществляются участником
            оборота самостоятельно'
          type: boolean
        unp:
          description: УНП, ИНН либо иной аналогичный идентификатор контрагента
          type: string
      type: object
    Aggregate:
      description: Объект «Агрегат» (класс Aggregate, п. 4.1.11)
      example:
        aggregate_inside: {}
        aggregates_count: 0
        high_aggregates:
        - level: 2
          uuid: 00048116129010631669
        labels_count: 5
        labels_inside:
        - "0104812845008808215CjBmJL,pugAq\x1D91FFD0\x1D92dGVzdBSSkDJP1g/BAAbCv3wv/OaXx8Fb2u5JT9pZgKc="
        level: 1
        status: Агрегат содержит коды и/или агрегаты
        user_info: СООО "Свиток"
      properties:
        aggregate_inside:
          additionalProperties:
            $ref: '#/components/schemas/Aggregate'
          description: Вложенные (подчиненные) агрегаты. Имя ключа элемента соответствует значению вложенного КА, значение
            элемента содержит описание и состав подчиненного агрегата. Объект класса Aggregate
          type: object
        aggregates_count:
          description: Количество нижестоящих (подчиненных) КА, вложенных в агрегат
          type: integer
        high_aggregates:
          description: Элемент массива содержит описание агрегата вышестоящего уровня, в который входит (принадлежит) исходный
            агрегат
          items:
            properties:
              level:
                description: Уровень вложенности вышестоящего агрегата
                type: integer
              uuid:
                description: КА (SSCC или собственный) вышестоящего уровня
                type: string
            type: object
          type: array
        labels_count:
          description: Количество КМ, вложенных в агрегат
          type: integer
        labels_inside:
          description: Массив (перечень) КМ, вложенных в агрегат
          items:
            type: string
          type: array
        level:
          description: Уровень вложенности агрегата
          type: integer
        status:
          description: Текущий статус агрегата
          type: string
        user_info:
          description: Наименование текущего владельца кодов
          type: string
      type: object
    Category:
      description: Объект «Раздел каталога (категория) товаров» (класс Category, п. 4.1.3). Перечень разделов каталога — таблица
        4.1.3.2 (коды разделов на промышленной и тестовой зоне отличаются)
      example:
        catalog_params:
        - group: Общая характеристика
          params:
          - code: 40
            is_editable: false
            is_required: true
            is_show_catalog: false
            name: ТН ВЭД
            type: text
            units: null
            value:
              list:
              - '0406'
              - '210500'
        code: 10089
        group:
          articul_required: false
          code: milk
          gtin_required: true
          is_gtin_add: true
          is_manually_add: false
          name: Молочная продукция
        items: []
        mark_params: []
        name: Молочная продукция
      properties:
        catalog_params:
          description: Массив (набор, состав) назначенных разделу каталога дополнительных параметров, описывающих товар в
            целом
          items:
            properties:
              group:
                description: Наименование группы параметров
                type: string
              params:
                description: Набор параметров и характеристик. Объекты класса Param (п. 4.1.5)
                items:
                  $ref: '#/components/schemas/Parameter'
                type: array
            type: object
          type: array
        code:
          description: Код (идентификатор) раздела каталога
          type: integer
        group:
          description: Сведения о товарной группе. Объект класса Group (п. 4.2.1), вложен inline
          properties:
            articul_required:
              description: 'Признак необходимости заполнения поля «Артикул» для товаров данной группы: False – не требуется;
                True – обязательно'
              type: boolean
            code:
              description: Ключ (идентификатор) товарной группы (перечень значений — таблица 4.2.1.2)
              type: string
            gtin_required:
              description: 'Признак необходимости заполнения поля «GTIN» для товаров данной группы: False – не требуется;
                True – обязательно'
              type: boolean
            is_gtin_add:
              description: 'Признак возможности добавления в каталог новых товаров данной группы, используется метод /items/addByGtin:
                False – запрещено; True – разрешено'
              type: boolean
            is_manually_add:
              description: 'Признак возможности добавления в каталог новых товаров данной группы, используется метод /items/add:
                False – запрещено; True – разрешено'
              type: boolean
            is_show_articul:
              description: 'Признак отображения (вывода, показа) артула в информации о товаре в каталоге: True – отображается;
                False – не отображается'
              type: boolean
            is_show_gtin:
              description: 'Признак отображения (вывода, показа) GTIN в информации о товаре в каталоге: True – отображается;
                False – не отображается'
              type: boolean
            name:
              description: Наименование товарной группы
              type: string
          type: object
        inner:
          description: Массив подчиненных (нижестоящих, вложенных) разделов каталога. Объекты класса Category
          items:
            $ref: '#/components/schemas/Category'
          type: array
        items:
          description: Массив, содержащий описания товаров указанного раздела каталога, внесенных участником (т.е. имеющих
            признак is_my = True). Объекты класса Item (п. 4.1.4)
          items:
            $ref: '#/components/schemas/Product'
          type: array
        mark_params:
          description: Массив (набор, состав) назначенных разделу каталога дополнительных параметров, описывающих партию промаркированного
            товара
          items:
            properties:
              group:
                description: Наименование группы параметров
                type: string
              params:
                description: Набор параметров и характеристик. Объекты класса Param (п. 4.1.5)
                items:
                  $ref: '#/components/schemas/Parameter'
                type: array
            type: object
          type: array
        name:
          description: Наименование раздела каталога
          type: string
      type: object
    CertificateType:
      description: 'Перечисление «Типы сертификатов» (раздел 4.3.6; код списка: `certificate_types`).

        Значение — код (`code`) типа документа подтверждения соответствия (вида разрешительного документа, сертификата). Перечень
        (таблица 4.3.6):


        | Код | Наименование |

        | --- | --- |

        | `CONFORMITY_CERTIFICATE` | Сертификат соответствия |

        | `CONFORMITY_DECLARATION` | Декларация о соответствии |

        | `STATE_REGISTRATION_CERTIFICATE` | Свидетельство о государственной регистрации |

        | `REGISTRATION_VET_CERTIFICATE` | Регистрационное удостоверение (вет. препараты) |

        | `REGISTRATION_CERTIFICATE` | Регистрационное удостоверение (мед. изделия) |

        '
      enum:
      - CONFORMITY_CERTIFICATE
      - CONFORMITY_DECLARATION
      - STATE_REGISTRATION_CERTIFICATE
      - REGISTRATION_VET_CERTIFICATE
      - REGISTRATION_CERTIFICATE
      example: CONFORMITY_CERTIFICATE
      type: string
    CirculationReason:
      description: 'Перечисление «Причины ввода в оборот» (раздел 4.3.5; код списка: `circulation_reason`).

        Значение — код (`code`) причины ввода в оборот. Перечень причин ввода в оборот (таблица 4.3.5; во вводном тексте указано
        «Некоторые значения перечисления», т.е. перечень может быть неполным):


        | Код | Наименование |

        | --- | --- |

        | `import` | Ввоз из стран ЕАЭС |

        | `import_third_countries` | Ввоз из третьих стран |

        '
      enum:
      - import
      - import_third_countries
      example: import
      type: string
    CodeStatus:
      description: 'Справочник «Статусы кодов» (раздел 4.2.3; имя класса: `LabelStatus`).

        Значение — код (`code`) статуса кода. Перечень статусов кодов (таблица 4.2.3.2):


        | Код | Наименование |

        | --- | --- |

        | 0 | Сгенерирован |

        | 10 | Заказ кодов |

        | 15 | Выдан код / Заказан |

        | 20 | Изготовлен |

        | 30 | Валидирован / Выдан код / Изготовлен |

        | 40 | Подписан РФ |

        | 45 | Импортирован |

        | 47 | Нанесен |

        | 50 | Промаркирован товар |

        | 52 | Транзитный товар |

        | 55 | Введен в оборот в РБ |

        | 80 | Реализован в розничной торговле |

        | 90 | Выбыл за границу |

        | 100 | Возврат в розничную торговлю |

        | 200 | Недействительно. Списан |


        Метаданные класса `LabelStatus` (таблица 4.2.3.1): `code` (Integer) — код (идентификатор) статуса кода; `name` (String)
        — наименование статуса кода.

        '
      enum:
      - 0
      - 10
      - 15
      - 20
      - 30
      - 40
      - 45
      - 47
      - 50
      - 52
      - 55
      - 80
      - 90
      - 100
      - 200
      example: 55
      type: integer
    CodeType:
      description: 'Справочник «Типы кодов, знаков» (раздел 4.2.2; имя класса: `LabelType`).

        Значение — код (`id`) типа кода или знака. ВНИМАНИЕ: в документе приведены НЕ все значения — «Некоторые значения справочника
        "Типы кода, знаков"» (таблица 4.2.2.2):


        | Код | Наименование |

        | --- | --- |

        | 6 | Код агрегации (SSCC) |

        | 7 | Код стран ЕАЭС идентификации товара |

        | 12 | Код РБ идентификации молочной продукции |

        | 13 | Код агрегации (импорт) |

        | 16 | Код стран ЕАЭС идентификации товара (Фототовары) |

        | 17 | Унифицированный контрольный знак (18*18) |

        | 18 | Стикер, содержащий средство идентификации (18*18) |

        | 19 | Знак защиты (18 х 10) |

        | 20 | Код РБ идентификации товара |

        | 21 | Защищённый материальный носитель с нанесенным средством идентификации, 28x30 мм |

        | 24 | Код РБ идентификации телефонов и машин вычислительных |

        | 25 | Защищенный материальный носитель с нанесенным средством идентификации (25 х 47) |

        | 26 | Защищенный материальный носитель с нанесенным средством идентификации (18 х 18) |

        | 29 | Защищенный материальный носитель с нанесенным средством идентификации (D16) |

        | 30 | Защищенный материальный носитель с нанесенным средством идентификации (D18) |


        Метаданные класса `LabelType` (таблица 4.2.2.1): `id` (Integer) — код (идентификатор) типа кода или знака; `name`
        (String) — наименование типа кода или знака; `method` (String) — метод генерации кода указанного типа; `is_bso` (Boolean)
        — признак бланка документа или документа с определенной степенью защиты (защищённого документа), в том числе содержащего
        нанесенное СИ; `digits_count` (Integer) — длина кода или число разрядов номера документа с определенной степенью защиты
        указанного типа; `letters_count` (Integer) — число знаков серии документа с определенной степенью защиты; `is_autotake`
        (Boolean) — признак возможности автоматического оприходования кода при передаче другому владельцу при отгрузке или
        реализации.

        '
      enum:
      - 6
      - 7
      - 12
      - 13
      - 16
      - 17
      - 18
      - 19
      - 20
      - 21
      - 24
      - 25
      - 26
      - 29
      - 30
      example: 20
      type: integer
    Country:
      description: 'Перечисление «Страны» (раздел 4.3.1; код списка: `country`).

        Значение — код (`code`) страны. Код — строка из трёх цифр, включая ведущий ноль (например, `051`).

        ВНИМАНИЕ: в документе приведён только фрагмент перечисления — «Перечень стран (фрагмент, страны ЕАЭС)» (таблица 4.3.1):


        | Код | Наименование |

        | --- | --- |

        | `051` | Армения |

        | `112` | Беларусь |

        | `398` | Казахстан |

        | `417` | Кыргызстан |

        | `643` | Россия |


        Примечание: документ не содержит явной ссылки на внешний классификатор; по формату (трёхзначные цифровые коды) значения
        соответствуют цифровым кодам ОКСМ / ISO 3166-1 numeric — это предположение, в документе прямо не указано.

        '
      enum:
      - '051'
      - '112'
      - '398'
      - '417'
      - '643'
      example: '112'
      type: string
    Currency:
      description: 'Перечисление «Валюты» (раздел 4.3.2; код списка: `currency`).

        Значение — код (`code`) валюты. ВНИМАНИЕ: в документе приведён только фрагмент перечисления (таблица 4.3.2):


        | Код | Наименование |

        | --- | --- |

        | `byn933` | Белорусский рубль |

        | `eur978` | Евро |

        | `kzt398` | Казахский тенге |

        | `rub643` | Российский рубль |

        | `usd840` | Доллар США |


        Примечание: документ не содержит явной ссылки на внешний классификатор; по формату код складывается из буквенного
        и цифрового кода валюты (например, `byn` + `933`), что соответствует ISO 4217 (alpha-3 + numeric) — это предположение,
        в документе прямо не указано.

        '
      enum:
      - byn933
      - eur978
      - kzt398
      - rub643
      - usd840
      example: byn933
      type: string
    Delivery:
      description: Объект «Поставка» (класс Import, п. 4.1.10)
      example:
        created_at: '2025-09-23 11:35:52+03'
        document_date: '2025-09-22'
        document_id: RU-UECB00000000000000000166-0046
        document_number: '0001234'
        document_processing_date: '2025-09-22'
        exporter_name: ООО ТрейдЛогСервис
        exporter_unp: '9715225506'
        group: juice
        info:
          not_received: 10
          received: 40
        sender_country_code: '643'
        status:
          code: 30
          message: Оприходован
        type: ship
        user_to:
          address: г. Минск,ул. Тимирязева, д.2, ком. 16
          country: '112'
          gln: '4811612900000'
          is_partly_blocked: false
          is_rules_agree: true
          name: Предприятие РБ для тестирования
          unp: '190704463'
      properties:
        created_at:
          description: Дата и время регистрации поставки в ГИС «Электронный знак»
          format: date-time
          type: string
        document_date:
          description: Дата документа, подтверждающего приобретение товара
          format: date
          type: string
        document_id:
          description: UID, уникальный идентификатор поставки
          type: string
        document_number:
          description: Номер документа, подтверждающего приобретение товара
          type: string
        document_processing_date:
          description: Дата передачи сведений оператором государства-члена ЕАЭС, из которого поступила трансграничная отгрузка
            (поставка)
          format: date
          type: string
        exporter_name:
          description: Наименование организации-продавца (поставщика, грузоотправителя, экспортёра) из государства-члена ЕАЭС
          type: string
        exporter_unp:
          description: УНН, ИНН или БИН организации-продавца (поставщика, грузоотправителя, экспортёра) из государства-члена
            ЕАЭС
          type: string
        group:
          description: Товарная группа (перечень значений — таблица 4.2.1.2)
          type: string
        info:
          description: Результаты обработки поставки
          properties:
            not_received:
              description: Общее количество не принятых (отклоненных) кодов идентификации
              type: integer
            received:
              description: Общее количество принятых (оприходованных) кодов идентификации
              type: integer
          type: object
        labels:
