    WriteoffReason:
      description: 'Перечисление «Причины списания» (раздел 4.3.4; код списка: `reasons`).

        Значение — код (`code`) причины списания. ВНИМАНИЕ: в документе приведён только фрагмент перечисления (таблица 4.3.4):


        | Код | Наименование |

        | --- | --- |

        | `damage` | Порча |

        | `destruction` | Уничтожение |

        | `liquidation` | Ликвидация (прекращение деятельности) |

        | `lost` | Утеря |

        | `mns` | Уведомление регулятора (МНС) |

