  /v3/ships/downloads:
    post:
      description: 'Метод «Список отгруженных кодов» (п. 3.7.3.2, Представление Б, версия v3). Возвращает перечень кодов (КМ
        или КА) отгрузки запрошенного типа. Варианты ответа: 1) сведения о кодах найдены — возвращается массив codes; 2) запрашиваемые
        сведения о кодах отсутствуют — возвращается сообщение detail ("файл не найден").'
      operationId: downloadShipCodesV3
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              file_type: labels_sent
              ship_id: 2000040045
            schema:
              properties:
                file_type:
                  description: Тип возвращаемых сведений
                  enum:
                  - labels_sent
                  - labels_taken
                  - labels_error
                  - aggregates_sent
                  - aggregates_taken
                  - destroy_aggregates
                  - destroy_aggregates_after_ship
                  type: string
                ship_id:
                  description: Номер отгрузки. ID отгрузки, полученный из методов /v3/ships/add (см. п. 3.7.1.1), /v3/ships/list
                    или /v3/ships/shipped (см. п. 3.7.5.2)
                  type: integer
              required:
              - ship_id
              - file_type
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                codes_found:
                  summary: Вариант 1. Сведения о кодах найдены
                  value:
                    codes:
                    - 0105201409805158215cFp<eKzEGR;f\u001d91FFD0\u001d92dGVzdI3PoF8ZiWLNWu55wIx04qjEU+aAdiMeEo7s2hE=
                    file_type: labels_sent
                    ship_id: 2000040045
                codes_not_found:
                  summary: Вариант 2. Запрашиваемые сведения о кодах отсутствуют
                  value:
                    detail: файл не найден
                    file_type: labels_taken
                    ship_id: 2000040045
              schema:
                oneOf:
                - description: Вариант 1. Сведения о кодах найдены
                  properties:
                    codes:
                      description: Массив (перечень) КМ или КА
                      items:
                        type: string
                      type: array
                    file_type:
                      description: Тип возвращаемых сведений
                      type: string
                    ship_id:
                      description: Номер (идентификатор) отгрузки (в таблице 3.7.3.4 — ключ ship)
                      type: integer
                  type: object
                - description: Вариант 2. Запрашиваемые сведения о кодах отсутствуют
                  properties:
                    detail:
                      description: Информационное сообщение
                      type: string
                    file_type:
                      description: Тип возвращаемых сведений
                      type: string
                    ship_id:
                      description: Номер (идентификатор) отгрузки (в таблице 3.7.3.4 — ключ ship)
                      type: integer
                  type: object
          description: 'Перечень кодов отгрузки (вариант 1 — сведения найдены, вариант 2 — сведения отсутствуют). Примечание:
            в таблице 3.7.3.4 документа ключ с идентификатором отгрузки назван ship, а в примерах ответа — ship_id (неоднозначность
