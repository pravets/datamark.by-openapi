  /v3/ships/add:
    post:
      description: 'Метод «Отгрузка кодов» (п. 3.7.1.2, Представление Б, версия v3). Регистрирует отгрузку кодов маркировки
        (КМ) или кодов агрегации (КА). Запрос должен обязательно содержать хотя бы один из параметров, в которых перечислены
        коды: "labels" для КМ либо "aggregates" для КА. Ограничения: КМ должны принадлежать одной товарной группе; КА не должен
        быть «пустым»; КА (в том числе вложенные) должны содержать КМ одной товарной группы; суммарное количество КМ на 1
        отгрузку: при отгрузке в страны ЕАЭС — не более 30 000 кодов, в остальных случаях — не более 100 000 кодов; при отгрузке
        за пределы Республики Беларусь КА не передаются (только КМ в массиве labels).'
      operationId: addShipV3
