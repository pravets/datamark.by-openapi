  /v3/reports/list:
    get:
      description: Представление Б метода «Список отчётов» (п. 3.5.6.2). Возвращает постраничный перечень отчётов и результатов
        их обработки с отбором по типу отчёта, датам создания/операции/документа-основания, причине, номеру документа-основания,
        товарной группе, GTIN, UID отчёта и статусу. Состав атрибутов элементов ответа зависит от типа отчёта и результатов
        его выполнения; могут содержаться дополнительные сведения. Представление А метода (перечень состояний отчётов без
        пагинации) доступно по адресу /v2/reports/list (п. 3.5.6.1).
      operationId: getReportListV3
      parameters:
      - description: Тип отчёта. ID типа отчёта, полученный из метода /v2/reports/types (см. п. 3.5.7; перечень значений приведен
          таблице 4.2.8.2)
        in: query
        name: report_type
        required: false
        schema:
          enum:
          - 1
          - 2
          - 4
          - 5
          - 6
          - 7
          - 8
          - 10
          - 11
          - 12
          - 13
          - 14
          - 15
          - 16
          type: integer
      - description: Номер страницы перечня отчётов
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
      - description: 'Число записей на странице. Примечание: Максимум – до 200, по умолчанию – до 15 на 1 страницу'
        in: query
        name: page_size
        required: false
        schema:
          default: 15
          maximum: 200
          type: integer
      - description: 'Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию
          даты и времени создания'
        in: query
        name: ordering
        required: false
        schema:
          enum:
          - created_at
          - -created_at
          type: string
      - description: 'Начальная дата создания отчёта. Формат: YYYY-MM-DD'
        in: query
        name: start_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Конечная дата создания отчёта. Формат: YYYY-MM-DD'
        in: query
        name: end_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Зависит от типа отчёта: 1. Для отчётов о списании кодов или знаков (report_type = 11) – причина списания:
          код значения перечисления reasons, полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен
          таблице 4.3.4). 2. Для отчётов о смене владельца (report_type = 15) – причина смены владельца; код значения перечисления
          change_of_owner, полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.7)'
        in: query
        name: reason
        required: false
        schema:
          enum:
          - damage
          - destruction
          - liquidation
          - lost
          - mns
          - other
          - spoilage
          - theft
          - Usemark
          - Writing_aggregation_code
          - reorganization
          - change_owner_goods
          type: string
      - description: 'Начальная дата операции. Формат: YYYY-MM-DD. Примечание: Используется для отчётов о списании кодов или
          знаков (report_type = 11)'
        in: query
        name: start_transaction_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Конечная дата операции. Формат: YYYY-MM-DD. Примечание: Используется для отчётов о списании кодов или
          знаков (report_type = 11)'
        in: query
        name: end_transaction_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Начальная дата документа-основания. Формат: YYYY-MM-DD. Примечание: Используется для отчётов о списании
          кодов или знаков (report_type = 11) или для отчётов о смене владельца (report_type = 15)'
        in: query
        name: start_document_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Конечная дата документа-основания. Формат: YYYY-MM-DD. Примечание: Используется для отчётов о списании
          кодов или знаков (report_type = 11) или для отчётов о смене владельца (report_type = 15)'
        in: query
        name: end_document_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Номер документа-основания. Примечание: Используется для отчётов о списании кодов или знаков (report_type
          = 11) или для отчётов о смене владельца (report_type = 15)'
        in: query
        name: document_number
        required: false
        schema:
          type: string
      - description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
        in: query
        name: group
        required: false
        schema:
          enum:
          - animal_feed
          - antiseptics
          - bike
          - caviar
          - clothes
          - construction
          - cosmetics
          - dietary_supplements
          - fur
          - grocery
          - juice
          - meat
          - medical_products
          - milk
          - motor_oil
          - oil_fat
          - perfum
          - preserves
          - photo
          - shoes
          - sweets
          - telephone
          - tires
          - toys
          - ukz
          - veterinary_medicines
          - water
          - leftovers_clothes
          - leftovers_shoes
          - leftovers_tires
          - radio
          type: string
      - description: 'GTIN товара. Шаблон: [0-9]{14}. Примечание: Используется для отчётов о маркировке / групповой маркировке
          (report_type = 1), отчётов о маркировке остатков (report_type = 6), отчётов о маркировке товаров из давальческого
          сырья (report_type = 10), отчётов о реализации знаков (report_type = 12) и отчётов об изменении параметров маркировки
          (report_type = 13)'
        in: query
        name: gtin
        required: false
        schema:
          pattern: ^[0-9]{14}$
          type: string
      - description: UID, уникальный идентификатор отчёта, по которому осуществляется поиск в списке
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Код статуса отчёта (перечень значений приведен таблице 4.2.5.2)
        in: query
        name: status
        required: false
        schema:
          enum:
          - 0
          - 10
          - 20
          - 25
          - 30
          - 40
          type: integer
