  /ships/add:
    put:
      description: 'Метод «Отгрузка кодов» (п. 3.7.1.1, Представление А). Регистрирует отгрузку кодов маркировки (КМ) или
        кодов агрегации (КА) в адрес контрагента-грузополучателя. Ограничения по массиву labels: 1) КМ должны принадлежать
        одной товарной группе; 2) КМ не должен входить в состав другого агрегата; 3) КА не должен быть «пустым»; 4) КА не
        должен входить в состав агрегата верхнего уровня; 5) нельзя одновременно указывать КМ и КА; 6) суммарное количество
        КМ на 1 отгрузку: при отгрузке в страны ЕАЭС — не более 30 000 кодов, в остальных случаях — не более 100 000 кодов;
        7) при отгрузке за пределы Республики Беларусь передаются только КМ (КА не передаются).'
      operationId: addShip
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              agent: 18413
              comment: Отгрузка согласно счёт-фактуре № 12456 от 04.11.2020
              count: 10
              country: '643'
              currency: rub643
              eas_products:
                04810268024894:
                  product_cost: '349.60'
                  product_tax: '0.00'
                04811309016724:
                  certificate_document_data:
                  - certificate_date: '2021-07-07'
                    certificate_number: '123'
                    certificate_type: CONFORMITY_CERTIFICATE
                  - certificate_date: '2021-07-07'
                    certificate_number: '321'
                    certificate_type: STATE_REGISTRATION_CERTIFICATE
                  product_cost: '2050.75'
                  product_tax: '205.08'
              labels:
              - 0104811309016724212R7V7577\u001d93iv4=
              - 01048113090167242128v8LZVn\u001d936rXO
              nomer_tn: ЮЯ03456789
              operation_date: '2020-11-24'
              price: 4567.89
              shipping_doc: tnttn
            schema:
              properties:
                agent:
                  description: ID контрагента-грузополучателя, в адрес которого осуществляется отгрузка кодов и который должен
                    будет выполнить их оприходование. Указывается значение реквизита id объекта класса Agent (см. п. 4.1.2)
                  example: 18413
                  type: integer
                comment:
                  description: Комментарий к отгрузке
                  example: Отгрузка согласно счёт-фактуре № 12456 от 04.11.2020
                  type: string
                count:
                  description: Общее количество единиц маркированного товара по сопроводительному документу
                  example: 10
                  type: integer
                country:
                  description: Цифровой код страны, в которую осуществляется отгрузка. Код значения перечисления country,
                    полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.1)
                  example: '643'
                  type: string
                currency:
                  description: Валюта отгрузки. Код значения перечисления currency, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.2)
                  example: rub643
                  type: string
                eas_products:
                  additionalProperties:
                    description: Дополнительные параметры отгрузки по указанному GTIN
                    properties:
                      certificate_document_data:
                        description: Массив сведений о документах, подтверждающих соответствие товара требованиям качества
                          и (или) безопасности
                        items:
                          properties:
                            certificate_date:
                              description: 'Дата документа, подтверждающего соответствие. Формат: YYYY-MM-DD'
                              example: '2021-07-07'
                              format: date
                              type: string
                            certificate_number:
                              description: Номер документа, подтверждающего соответствие
                              example: '123'
                              type: string
                            certificate_type:
                              description: Вид документа, подтверждающего соответствие (разрешительный документ). Код значения
                                перечисления certificate_types, полученного методом /directories/{:code} (см. п. 3.8.3; перечень
                                значений приведен таблице 4.3.6, допустимые значения приведены в приложении Е)
                              example: CONFORMITY_CERTIFICATE
                              type: string
                          required:
                          - certificate_type
                          - certificate_number
                          - certificate_date
                          type: object
                        type: array
                      product_cost:
                        description: 'Цена за единицу товара (с учётом НДС, если товар облагается НДС). Передается в российских
                          рублях (RUB): формат 1 — в рублях строкой в формате [0-9]\.[0-9]{2}, например "123.00"; формат 2
                          — в копейках целым числом, например 12300'
                        example: '2050.75'
                        oneOf:
                        - type: string
                        - type: integer
                      product_tax:
                        description: Сумма НДС единицы товара (форматы — как у product_cost)
                        example: '205.08'
                        oneOf:
                        - type: string
                        - type: integer
                    type: object
                  description: Дополнительные сведения о поставляемых товарах. Используется в случае передачи сведений об
                    отгрузке в рамках трансграничной торговли между государствами-членами ЕАЭС. Имя ключа элемента соответствует
                    значению GTIN товара, значение элемента содержит дополнительные параметры отгрузки по указанному GTIN
                  type: object
                labels:
                  description: Массив КМ или КА, подлежащих отгрузке. КА могут использоваться только при отгрузках в пределах
                    Республики Беларусь
                  items:
                    type: string
                  type: array
                nomer_tn:
                  description: Номер сопроводительного документа, может также включать серию
                  example: ЮЯ03456789
                  type: string
                operation_date:
                  description: 'Дата отгрузки (совершения операции участником, как правило — дата сопроводительного документа).
                    Формат: YYYY-MM-DD. Ограничение: дата отгрузки не должна быть ранее даты генерации КМ'
                  example: '2020-11-24'
                  format: date
                  type: string
                price:
                  description: Общая стоимость маркированного товара по сопроводительному документу
                  example: 4567.89
                  type: number
                shipping_doc:
                  description: Вид сопроводительного документа. Код значения перечисления shippingDocs, полученного методом
                    /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.3)
                  example: tnttn
                  type: string
              required:
              - shipping_doc
              - nomer_tn
              - agent
              - count
              - country
              - operation_date
              - labels
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                message: '#4355 успешно создана.'
                ship: 4355
              schema:
                properties:
                  message:
                    description: Информационное сообщение
                    type: string
                  ship:
                    description: Номер (идентификатор) отгрузки
                    type: integer
                type: object
          description: Результат регистрации отгрузки
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Отгрузка кодов
      tags:
      - Отгрузки и приёмка
  /ships/addImport:
    post:
      description: Метод «Приёмка поставки из ЕАЭС» (п. 3.7.9). Выполняет приёмку кодов идентификации, переданных при трансграничной
        отгрузке (поставке) из государства-члена ЕАЭС. Доверительная приёмка выполняется на основе документа трансграничной
        отгрузки (type = ship) либо документа с типом поставки type = export. Если массив labels не заполнен, вся поставка
        будет отклонена, а переданные в ней коды будут автоматически возвращены грузоотправителю.
      operationId: addShipImport
      requestBody:
        content:
          application/json; charset=utf-8:
            examples:
              acceptance:
                summary: Вариант 1. Доверительная приёмка на основе документа трансграничной отгрузки (type = ship)
                value:
                  document_date: '2025-09-22'
                  document_id: RU-UECB00000000000000000166-0046
                  document_number: '0001234'
                  exporter_name: ООО ТрейдЛогСервис
                  exporter_unp: '9715225506'
                  group: juice
                  labels:
                  - 01077800541897932159.zgFtCWaUs1
                  - 010778005418979321597vz'aAzogDD
              rejection:
                summary: Вариант 2. Отклонение документа трансграничной отгрузки (type = ship)
                value:
                  document_id: RU-UECB00000000000000000169-0048
                  group: milk
                  labels: []
            schema:
              properties:
                document_date:
                  description: 'Дата документа, подтверждающего приобретение товара. Формат: YYYY-MM-DD. Примечание: Обязательно,
                    если документ поставки, по которому осуществляется приёмка, имеет тип type = export'
                  format: date
                  type: string
                document_id:
                  description: 'Уникальный идентификатор документа с типом поставки type = ship или type = export, по которому
                    осуществляется приёмка, полученный из метода /ships/importList (см. п. 3.7.8). Примечание: Указывается
                    при одновременном соблюдении следующих условий: 1. Сведения о поставке переданы экспортёром и получены
                    в ГИС «Электронный знак»; 2. Текущий статус документа поставки «Обработан» (status.code = 10); 3. Планируется
                    выполнять отложенный либо частичный ввод в оборот КМ, в том числе в несколько приёмов.'
                  type: string
                document_number:
                  description: 'Номер документа, подтверждающего приобретение товара. Примечание: Обязательно, если документ
                    поставки, по которому осуществляется приёмка, имеет тип type = export'
                  type: string
                exporter_name:
                  description: 'Наименование организации-продавца (поставщика, грузоотправителя, экспортёра) из государства-члена
                    ЕАЭС. Примечание: Обязательно, если документ поставки, по которому осуществляется приёмка, имеет тип type
                    = export'
                  type: string
                exporter_unp:
                  description: 'УНН, ИНН или БИН организации-продавца (поставщика, грузоотправителя, экспортёра) из государства-члена
                    ЕАЭС. Примечание: Обязательно, если документ поставки, по которому осуществляется приёмка, имеет тип type
                    = export'
                  type: string
                group:
                  description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
                  type: string
                labels:
                  description: 'Массив принимаемых к учёту кодов идентификации, переданных при трансграничной отгрузке (поставке).
                    Примечания: 1. Перечисляются только коды идентификации, фактически принятые к учёту из указанной по document_id
                    поставки. 2. В случае, если массив labels не заполнен, вся поставка будет отклонена, а переданные в ней
                    коды будут автоматически возвращены грузоотправителю.'
                  items:
                    type: string
                  type: array
              required:
              - group
              - document_id
              - labels
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                acceptance:
                  summary: Вариант 1. Доверительная приёмка на основе документа трансграничной отгрузки (type = ship)
                  value:
                    created_at: '2025-09-23 11:35:52+03'
