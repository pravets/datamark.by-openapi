                    причине их использования для целей маркировки товаров (reason = usemark)'
                  enum:
                  - usemark
                  type: string
                shipping_doc:
                  description: Вид документа, подтверждающего факт списания. Код значения перечисления shippingDocs, полученного
                    методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.3)
