        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Отчёт об агрегировании (Представление А)
      tags:
      - Отчеты
