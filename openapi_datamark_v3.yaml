        | `fur` | Предметы одежды из натурального меха |

        | `grocery` | Бакалея и растворимые завариваемые напитки |

        | `juice` | Безалкогольные напитки и соки |

        | `meat` | Мясная продукция |

        | `medical_products` | Медицинские изделия |

        | `milk` | Молочная продукция |

        | `motor_oil` | Смазочные материалы, масла и специальные автомобильные жидкости |

        | `oil_fat` | Растительные масла и масложировая продукция |

        | `perfum` | Духи и туалетная вода |

        | `preserves` | Консервированная продукция |

        | `photo` | Фотоаппараты и лампы-вспышки |

        | `shoes` | Обувь |

        | `sweets` | Сладости и кондитерские изделия |

        | `telephone` | Телефоны и машины вычислительные |

        | `tires` | Шины и покрышки |

        | `toys` | Игры и игрушки для детей |

        | `ukz` | Товары, подлежащие маркировке УКЗ |

        | `veterinary_medicines` | Ветеринарные лекарственные препараты |

        | `water` | Вода упакованная |

        | `leftovers_clothes` | Остатки. Товары легкой промышленности |

        | `leftovers_shoes` | Остатки. Обувь |

