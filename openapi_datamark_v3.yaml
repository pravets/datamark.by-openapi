    ShipStatus:
      description: 'Справочник «Статусы отгрузок» (раздел 4.2.6; имя класса: `ShipStatus`).

        Значение — код (`code`) статуса отгрузки. Перечень статусов отгрузок (таблица 4.2.6.2):


        | Код | Наименование |

        | --- | --- |

        | 0 | Создан |

        | 5 | В обработке |

        | 7 | Отклонён |

        | 10 | В пути |

        | 12 | Отгружен |

        | 15 | Ошибка |

        | 17 | Ожидает приёмку |

        | 19 | Частично оприходован |

        | 20 | Принят |

        | 30 | Отменен |


        Метаданные класса `ShipStatus` (таблица 4.2.6.1): `code` (Integer) — код (идентификатор) статуса отгрузки; `name`
        (String) — наименование статуса отгрузки.

