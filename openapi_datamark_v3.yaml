  /v2/labels:
    post:
      description: Метод «Валидация кодов маркировки» (п. 3.4.6). Проверяет наличие кодов маркировки (КМ) в информационной
        системе и возвращает текущий статус, принадлежность и тип каждого подтвержденного КМ.
      operationId: validateLabels
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              labels:
              - "0104811215019130212tSKmLjdjc6N9\x1D91TEST\x1D92testtest... testtest"
              - "01048112150191302127USNfqUza15o\x1D91TEST\x1D92testtest... testtest"
              - "0104811215019130212K2HSsx7xaPPj\x1D91TEST\x1D92testtest... testtest"
            schema:
              properties:
                labels:
                  description: 'Массив КМ, подлежащих проверке. Ограничение: не более 1 000 КМ на 1 запрос'
                  items:
                    description: Код маркировки (КМ)
                    type: string
                  maxItems: 1000
                  type: array
              required:
              - labels
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                labels:
                - found: true
                  is_my: true
                  label: "0104811215019130212tSKmLjdjc6N9\x1D91TEST\x1D92testtest... testtest"
                  status:
                    code: 30
                    message: Валидирован
                  type:
                    id: 20
                    name: Код РБ идентификации товара (обувь, шины, легкая промышленность)
                - found: false
                  label: "0104811215019130212DvkEvnDcmEdF\x1D91TEST\x1D92testtest...test"
              schema:
                properties:
                  labels:
                    description: Массив, содержащий результаты проверки по каждому КМ
                    items:
                      properties:
                        found:
                          description: 'Признак (подтверждение) наличия КМ в информационной системе: true – подтверждено;
                            false – не подтверждено'
                          type: boolean
                        is_my:
                          description: 'Признак принадлежности кода: true – текущему участнику; false – другому контрагенту.
                            Примечание: возвращается при found = true'
                          type: boolean
                        label:
                          description: КМ, подлежащий проверке
                          type: string
                        status:
                          description: 'Текущий статус КМ. Объект класса LabelStatus (см. п. 4.2.3). Примечание: возвращается
                            при found = true'
                          properties:
                            code:
                              description: Код (идентификатор) статуса кода
                              type: integer
                            message:
                              description: Наименование статуса кода (в таблице 4.2.3.1 поле поименовано как name)
                              type: string
                          type: object
                        type:
                          description: 'Тип кода. Объект класса LabelType (см. п. 4.2.2). Примечание: возвращается при found
                            = true'
                          properties:
                            digits_count:
                              description: Длина кода или число разрядов номера документа с определенной степенью защиты указанного
                                типа
                              nullable: true
                              type: integer
                            id:
                              description: Код (идентификатор) типа кода или знака
                              type: integer
                            is_autotake:
                              description: Признак возможности автоматического оприходования кода
                              type: boolean
                            is_bso:
                              description: Признак защищенного документа
                              type: boolean
                            letters_count:
                              description: Число знаков серии документа с определенной степенью защиты
                              nullable: true
                              type: integer
                            method:
                              description: Метод генерации кода указанного типа
                              type: string
                            name:
                              description: Наименование типа кода или знака
                              type: string
                          type: object
                      required:
                      - label
                      - found
                      type: object
                    type: array
                type: object
          description: Результаты проверки кодов маркировки
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Валидация кодов маркировки
      tags:
      - Коды и знаки
  /v2/labels/addAggregate:
    post:
      description: 'Представление А метода «Регистрация собственных кодов агрегации» (п. 3.4.1.1). Регистрирует сформированные
        участником оборота собственные коды агрегации (КА); в ответе возвращаются итоги (количество успешных/отклоненных КА
        и перечень ошибок). Представление Б того же метода доступно по адресу /v3/labels/addAggregate (п. 3.4.1.2) и отличается
        структурой ответа (возвращаются номер заказа и итоги). Критерии отнесения товарных групп к представлениям А/Б в документе
        не указаны. Примечание: для генерации КА в формате SSCC используется метод заказа кодов /v2/orders/add (см. п. 3.3.1.1)
        с типом кода label_type = 6.'
      operationId: addAggregateV2
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              aggregate:
              - "000481901888000000320204811309016724376\x1D1320111110abcdef"
              - "000481901888000000180204811309016724376\x1D1320111230987zyx"
              - "000481901888000000560204811309016724376\x1D1320111230987d1e"
            schema:
              properties:
                aggregate:
                  description: 'Массив (перечень) КА, сформированных участником оборота. Ограничения: 1. Длина КА – от 21
                    до 74 символов. 2. Не более 1 000 КА на 1 запрос.'
                  items:
                    description: Код агрегации (КА), длина от 21 до 74 символов
                    maxLength: 74
                    minLength: 21
                    type: string
                  maxItems: 1000
                  type: array
              required:
              - aggregate
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                count:
                  failed: 2
                  success: 98
                error:
                - 010481533023884121wbv2 already exists
                - 8974klsakbdlalk3 already exists
              schema:
                properties:
                  count:
                    description: Количество КА (итоги)
                    properties:
                      failed:
                        description: количество ошибочных (отклоненных) КА
                        type: integer
                      success:
                        description: количество успешно добавленных КА
                        type: integer
                    type: object
                  error:
                    description: Массив (перечень) отклоненных КА с описанием ошибок
                    items:
                      type: string
                    type: array
                type: object
          description: Результат регистрации собственных кодов агрегации
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Регистрация собственных кодов агрегации (Представление А)
      tags:
      - Коды и знаки
