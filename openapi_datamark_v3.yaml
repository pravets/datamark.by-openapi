        Представление А (п. 3.5.2.1, API версий v1/v2). Альтернативное Представление Б (п. 3.5.2.2, API версии v3) применяется
        по пути /v3/reports/addGroupMark. В документе явное соответствие товарных групп представлениям не указано: в примере
