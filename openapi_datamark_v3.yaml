        (Boolean) — признак возможности добавления в каталог новых товаров группы методом /items/add; `is_gtin_add` (Boolean)
        — признак возможности добавления в каталог новых товаров группы методом /items/addByGtin; `is_show_gtin` (Boolean)
        — признак отображения GTIN в информации о товаре в каталоге; `is_show_articul` (Boolean) — признак отображения артикула
        в информации о товаре в каталоге.

        '
      enum:
