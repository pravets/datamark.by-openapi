        бланков УКЗ с возможностью отбора по причинам списания.
      operationId: getDestroyList
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              page: 1
              reason:
              - damage
              - lost
              - usemark
            schema:
              properties:
                page:
                  description: Номер страницы перечня списаний
                  type: integer
                reason:
                  description: Массив с перечнем причин списания. Коды значений перечисления reasons, полученного методом
                    /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.4)
                  items:
                    enum:
                    - damage
                    - destruction
                    - liquidation
                    - lost
                    - mns
                    - other
                    - spoilage
                    - theft
                    - Usemark
                    - Writing_aggregation_code
                    type: string
                  type: array
              required:
              - page
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                count: 302
                destroy_list:
                - created_at: '2021-06-17 16:28:41+03'
                  label: 019481900857000421011050791AAA
                  message:
                    message: ''
                    name: ФН254
                    reason: damage
                    shipping_doc: akt
                  status:
                    code: null
                    message: null
                  type:
                    digits_count: 9
                    id: 17
                    is_autotake: true
                    is_bso: true
                    letters_count: 3
                    method: ukz
                    name: Унифицированный контрольный знак (18*18)
                  user:
                    info:
                      address: 220116, г Минск, проспект " Газеты Звязда" 3-22
                      country: '112'
                      gln: '4819020530000'
                      is_rules_agree: true
                      name: Индивидуальный предприниматель Дещиц Александр Евгеньевич
                      unp: 100412881
                    lastname: Дещиц
                    name: Александр
              schema:
                properties:
                  count:
                    description: Общее количество списаний в выборке с текущими отборами (фильтрами)
                    type: integer
                  destroy_list:
                    description: Массив с перечнем списаний КМ, КА или серий и номеров бланков УКЗ
                    items:
                      properties:
                        created_at:
                          description: Дата и время списания
                          format: date-time
                          type: string
                        label:
                          description: Списанный КМ, КА либо серия и номер бланка УКЗ
                          type: string
                        message:
                          description: Сведения о документе и причине списания
                          properties:
                            message:
                              description: Комментарий к операции списания
                              type: string
                            name:
                              description: Наименование (номер) документа, подтверждающего факт списания
                              type: string
                            reason:
                              description: Причина списания (код значения перечисления reasons, таблица 4.3.4)
                              type: string
                            shipping_doc:
                              description: Вид документа, подтверждающего факт списания (код значения перечисления shippingDocs,
                                таблица 4.3.3)
                              type: string
                          type: object
                        status:
                          description: Статус обработки списания
                          properties:
                            code:
                              description: Код статуса (в примере документа null)
                              nullable: true
                            message:
                              description: Сообщение статуса (в примере документа null)
                              nullable: true
                          type: object
                        type:
                          description: Тип кода. Объект класса LabelType (см. п. 4.2.2)
                          properties:
                            digits_count:
                              description: Длина кода или число разрядов номера документа с определенной степенью защиты указанного
                                типа
                              nullable: true
                              type: integer
                            id:
                              description: Код (идентификатор) типа кода или знака
                              type: integer
                            is_autotake:
                              description: Признак возможности автоматического оприходования кода
                              type: boolean
                            is_bso:
                              description: Признак защищенного документа
                              type: boolean
                            letters_count:
                              description: Число знаков серии документа с определенной степенью защиты
                              nullable: true
                              type: integer
                            method:
                              description: Метод генерации кода указанного типа
                              type: string
                            name:
                              description: Наименование типа кода или знака
                              type: string
                          type: object
                        user:
                          description: Сведения о пользователе, выполнившем списание
                          properties:
                            info:
                              description: Сведения об участнике оборота
                              properties:
                                address:
                                  description: Адрес участника оборота
                                  type: string
                                country:
                                  description: Цифровой код страны (код значения перечисления country, таблица 4.3.1)
                                  type: string
                                gln:
                                  description: GLN участника оборота
                                  type: string
                                is_rules_agree:
                                  description: Признак присоединения к публичному договору
                                  type: boolean
                                name:
                                  description: Наименование участника оборота
                                  type: string
                                unp:
                                  description: УНП участника оборота
                                  type: integer
                              type: object
                            lastname:
                              description: Фамилия пользователя
                              type: string
                            name:
                              description: Имя пользователя
                              type: string
                          type: object
                      type: object
                    type: array
                type: object
          description: Перечень списаний с текущими отборами (фильтрами)
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Список списаний
      tags:
      - Коды и знаки
