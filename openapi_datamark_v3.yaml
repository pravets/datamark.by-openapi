        нижестоящего уровня из указанного агрегата.
      operationId: deleteFromAggregate
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              aggregate: "000481901888000000180204811309016724376\x1D1320111230987zyx"
              labels:
              - "0104811309016724212R7V7577\x1D93iv4="
              - "01048113090167242128v8LZVn\x1D936rXO"
            schema:
              properties:
                aggregate:
                  description: КА (SSCC или собственный)
                  type: string
                labels:
                  description: 'Массив КМ или КА нижестоящего уровня, исключаемых из агрегации. Ограничение: коды должны быть
                    одного либо однородных типов; не допускается одновременное использование на одном уровне группировки КМ
                    и КА нижних уровней'
                  items:
                    description: КМ либо КА нижестоящего уровня
