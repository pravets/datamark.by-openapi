  /v3/orders/addGroupOrders:
    post:
      description: 'Метод «Групповой заказ кодов маркировки» (п. 3.3.4).

        Представление Б — версия API v3 (п. 3.3.4.2).

        Представление А (версия API v2) — POST /v2/orders/addGroupOrders

        (см. п. 3.3.4.1).

        Ограничения: не более 100 GTIN на 1 запрос; на каждый GTIN в запросе

        в зависимости от типа кода: для label_type = 12 — не более 100 000

        кодов, для остальных типов — не более 10 000 кодов; для заказа

        доступны только коды с типом label_type = 7, 12, 20 или 24.

        '
      operationId: createGroupOrdersV3
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              group: dietary_supplements
              orders:
                00625273050882:
                  comment: Короткий КМ
                  count: 5
                  label_type: 7
                  template_id: 23
                04812845008808:
                  comment: Длинный КМ
                  count: 5
                  label_type: 7
            schema:
              properties:
                group:
                  description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
                  example: dietary_supplements
                  type: string
                orders:
                  additionalProperties:
                    properties:
                      comment:
                        description: Комментарий к заказу
                        example: Длинный КМ
                        type: string
                      count:
                        description: 'Количество заказываемых кодов. Ограничение: На каждый GTIN в запросе в зависимости от
                          типа кода: 1. Для типа кода label_type = 12 – не более 100 000 кодов; 2. Для остальных типов – не
                          более 10 000 кодов.'
                        example: 5
                        type: integer
                      label_type:
                        description: 'Тип кода. ID кода, полученный из метода /labels/types (см. п. 3.4.3; перечень значений
                          приведен таблице 4.2.2.2). Ограничение: Для заказа доступны только коды с типом label_type = 7,
                          12, 20 или 24'
                        enum:
                        - 7
                        - 12
                        - 20
                        - 24
                        example: 7
                        type: integer
                      template_id:
                        description: 'Шаблон КМ. ID структуры КМ, определяющий вариант состава групп данных, установленный
                          для соответствующей товарной группы (перечень значений приведен в приложении Д). Примечания: 1.
                          Применяется для КМ российского образца (label_type = 7). 2. По умолчанию используется основной (рекомендуемый)
                          шаблон, установленный для соответствующей товарной группы'
                        example: 23
                        type: integer
                      typography_doc:
                        description: Номер и дата заказа (договора с типографией)
                        type: string
                      typography_id:
                        description: ID типографии, полученный методом /users/typographyList (см. п. 3.8.4)
                        type: integer
                    required:
                    - count
                    - label_type
                    type: object
                  description: 'Параметры заказов КМ. Имя ключа элемента соответствует значению GTIN товара, значение элемента
                    содержит параметры для заказа к указанному GTIN. Шаблон ключа: [0-9]{14}. Ограничение: Не более 100 GTIN
