    ErrorResponse:
      description: 'Единая схема ответа с ошибкой (HTTP 4XX).


        Коды ошибок (раздел 5 документации, таблица 5), сгруппированные по HTTP-статусам:


        **HTTP 400 — Некорректные данные:** 400 — Ошибка во входных параметрах запроса.


        **HTTP 401 — Неверный токен авторизации:** 1202 — Неправильное имя пользователя; 1203 — Неправильный пароль; 10004
        — Срок действия токена авторизации истек; 13001 — Неверный токен; 13002 — Неверный токен либо пользователь заблокирован.


        **HTTP 403 — Нет прав доступа:** 403 — Файл не найден или у вас нет прав доступа; 13003 — В доступе отказано / Доступ
        запрещен; 2102 — Вы не можете создать этот заказ.


        **HTTP 404 — Запрашиваемые данные не найдены:** 1250 — Справочник-перечисление не найден; 1401 — Заявки не найдены;
        1450 — Невозможно обновить статусы кодов; 1451 — Контрагент не найден; 1452 — Невозможно добавить контрагента; 1453
        — Контракт (договор) не найден; 1454 — Невозможно обновить данные контракта (договора); 1455 — Контрагент с такими
        данными уже имеется в системе; 1488 — Отгрузка не найдена; 1501 — Заказ не найден; 1507 — Невозможно сохранить коды
        из заказа; 1508 — Ошибка групп товаров; 1509 — Коды должны принадлежать вам. Статус кода должен быть ''Выдан код''.
        GTIN должен соответствовать товарной группе; 1660 — Раздел каталога товаров не найден; 1701 — Код маркировки или код
        агрегации не найден; 1702 — Ошибка создания / обновления сведений о коде; 1706 — Указанный код не является кодом агрегации;
        1708 — Неверный тип кода; 1711 — Код агрегации не может быть добавлен; 1766 — Отчёт не найден; 2001 — Товар не найден;
        2004 — Тип кода не найден; 2005 — Ошибка обновления сведений о товаре; 2007 — Некорректные параметры товара; 2008
        — Невозможно сохранить параметры товара; 2010 — GTIN товара не найден; 2011 — Код ТН ВЭД ЕАЭС не указан; 2012 — Не
        указаны обязательные характеристики товара; 10001 — Документ поставки не найден или обработан ранее.


        Примечание: привязка кодов к HTTP-статусам — как в документе (часть кодов группы 404 по смыслу является бизнес-ошибками).
        Коды для HTTP 500 в документе отсутствуют.'
      example:
        details:
        - Field ... must be ...
        error: 400
        message: Input parameters validation error
      properties:
        details:
          description: Детальное описание ошибок
          items:
            type: string
          type: array
        error:
          description: Код ошибки
          type: integer
        message:
          description: Сообщение пользователю и/или описание ошибки
          type: string
      required:
      - error
      - message
      type: object
