  /v3/reports/addAggregate:
    post:
      description: 'Метод «Отчёт об агрегировании» (п. 3.5.3). Для данного пути канонически применяется Представление Б (п.
        3.5.3.2, API версии v3). Альтернативное Представление А (п. 3.5.3.1, API версий v1/v2) применяется по пути /v2/reports/addAggregate.
        Примечание: в Представлении Б параметр group необязателен, а поля labels и aggregates имеют условную обязательность
        («Да/Нет» — предположительно, заполняется хотя бы один из массивов).'
      operationId: createAggregateReportV3
      requestBody:
        content:
          application/json; charset=utf-8:
            examples:
              variant1_labels:
                summary: Вариант 1. Агрегация начального уровня (коды маркировки)
                value:
                  aggregate: "1323010520222111\x1D4144811612900000422112"
                  labels:
                  - "0104812845008808215CjBmJL,pugAq\x1D91FFD0\x1D92dGVzdBSSkDJP1g/BAAbCv3wv/OaXx8Fb2u5JT9pZgKc="
                  - "0104812845008808215&)')WXeauGKm\x1D91FFD0\x1D92dGVzdPBTdSpuGymZRALebENUimTf271ALnTtHAC/ZFY="
                  - "0104812845008808215j.FUYPHZM_nV\x1D91FFD0\x1D92dGVzdBslwK4e8qW5oRXvEE8W49YCi+uoC4R3REf5730="
              variant2_aggregates:
                summary: Вариант 2. Агрегация второго и последующих уровней (вложенные коды агрегации)
                value:
                  aggregate: 00048116129010631669
                  aggregates:
                  - "000481901888000000320204811309016724376\x1D1320111110abcdef"
                  - "000481901888000000180204811309016724376\x1D1320111230987zyx"
                  - "000481901888000000560204811309016724376\x1D1320111230987d1e"
            schema:
              oneOf:
              - description: Структура тела запроса для API версии v3 (путь /v3/reports/addAggregate, п. 3.5.3.2). Обязательность
                  полей labels и aggregates в документе указана как «Да/Нет» (условная); предположительно, должен быть заполнен
                  хотя бы один из массивов (в документе условие не формализовано — см. notes_reports_a.md).
                properties:
                  aggregate:
                    description: КА (SSCC или собственный)
                    type: string
                  aggregates:
                    description: 'Массив КА нижестоящего уровня, подлежащих агрегации. Примечание: 1) КА не должен быть «пустым»,
                      т.е. должен содержать вложенные коды (подчиненные КМ или КА нижних уровней вложенности); 2) КА (в том
                      числе вложенные) должны содержать КМ, принадлежащие одной товарной группе и имеющие одинаковый статус;
                      3) КА не должен входить в состав агрегата верхнего либо вышестоящего уровня. Обязательность: «Да/Нет»
                      (условная, см. notes_reports_a.md).'
                    items:
                      type: string
                    type: array
                  group:
                    description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
                    type: string
                  labels:
                    description: 'Массив КМ, подлежащих агрегации. Ограничения: 1) не более 100 000 КМ на 1 запрос, в том
                      числе суммарно на всё дерево агрегации (структуру вложенности с учётом подчиненных КА); 2) не более
                      5 уровней вложенности (начиная с верхнего уровня агрегации). Примечание: КМ должны принадлежать одной
                      товарной группе и иметь одинаковый статус; КМ не должен входить в состав другого агрегата; нельзя одновременно
                      указывать КМ и КА, к которому он «привязан». Обязательность: «Да/Нет» (условная, см. notes_reports_a.md).'
                    items:
                      type: string
                    maxItems: 100000
                    type: array
                required:
                - aggregate
                title: Представление Б (API v3)
                type: object
              - description: Структура тела запроса для API версий v1/v2 (путь /v2/reports/addAggregate, п. 3.5.3.1). Параметр
                  group в данном представлении отсутствует.
                properties:
                  aggregate:
                    description: КА (SSCC или собственный)
                    type: string
                  labels:
                    description: 'Массив КМ либо КА нижестоящего уровня, подлежащих агрегации. Ограничения: 1) КМ должны принадлежать
                      одной товарной группе и иметь одинаковый статус; 2) КМ не должен входить в состав другого агрегата;
                      3) КА не должен быть «пустым», т.е. должен содержать вложенные коды (подчиненные КМ или КА нижних уровней);
                      4) КА не должен входить в состав агрегата верхнего уровня; 5) нельзя одновременно указывать КМ и КА,
                      к которому он «привязан»; 6) не более 25 000 КМ или КА на 1 запрос.'
                    items:
                      type: string
                    maxItems: 25000
                    type: array
                required:
                - aggregate
                - labels
                title: Представление А (API v1/v2)
                type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                report_id: 5214
                report_uid: cd31ab3a-f4ed-42c4-b464-95e435f3a1ca
              schema:
                properties:
                  report_id:
                    description: ID отчёта
                    type: integer
                  report_uid:
                    description: UID, уникальный идентификатор отчёта об агрегировании (report_type = 2)
                    type: string
                type: object
          description: Успешное выполнение запроса
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Отчёт об агрегировании (Представление Б)
      tags:
      - Отчеты
  /v3/reports/addChangeOwnerMade:
    post:
      description: 'Метод «Отчёт о смене владельца» (п. 3.5.15). Для данного пути применяется Представление Б (п. 3.5.15.2,
        API версии v3). Альтернативное Представление А (п. 3.5.15.1, API версии v2) доступно по пути /v2/reports/addChangeOwnerMade
        (без параметра aggregates; labels в нём обязателен). Явная привязка товарных групп к представлениям в документе не
        указана: в примерах Представления Б использована товарная группа dietary_supplements. Примечание документа: запрос
        должен обязательно содержать хотя бы один из параметров, в которых перечислены коды ("labels" для КМ либо "aggregates"
        для КА).'
      operationId: createChangeOwnerReportV3
      requestBody:
        content:
          application/json; charset=utf-8:
            examples:
              variant1_reorganization:
                summary: Вариант 1. Смена владельца при реорганизации субъекта хозяйствования (reason = reorganization)
                value:
                  agent: 10564
                  comment: Переход ИП в созданное им ЮЛ
                  document_date: '2025-01-10'
                  document_number: 1001/1
                  document_type: aktreorg
                  labels:
                  - "0104812845008808215?&T.nniB,0&u\x1D91FFD0\x1D92dGVzdLRHvQ6LVjFS4HwoxLFJrFwQsXDTXbpz4bEcIRA="
                  - "0104812845008808215&)')WXeauGKm\x1D91FFD0\x1D92dGVzdPBTdSpuGymZRALebENUimTf271ALnTtHAC/ZFY="
                  reason: reorganization
              variant2_change_owner_goods:
                summary: Вариант 2. Смена владельца маркированного товара (reason = change_owner_goods)
                value:
                  group: dietary_supplements
                  labels:
                  - "0100625273050882215<AID7N0Td05T\x1D91FFD0\x1D92dGVzdBUtbl+pU+1oajFxrtPOKkvMoaRYA0cQyD+IWEc="
                  - "0100625273050882215JKLDGHJT(34Q\x1D91FFD0\x1D92dGVzdO6uV4PpGZGxDqZMgE++H9WeH7vMnBbvv1MGCHg="
                  reason: change_owner_goods
            schema:
              properties:
                agent:
                  description: 'ID контрагента-правопредшественника (прежнего владельца), которому ранее принадлежали неиспользованные
                    КМ, УКЗ, ЗЗ и/или ЗМН. Примечания: 1. Указывается значение реквизита id объекта класса Agent (см. п. 4.1.2).
                    2. Должен иметь признак зарегистрированного участника оборота товаров (is_verified = True). Примечание:
                    Обязательно указывается только если причина смены владельца – реорганизация субъекта хозяйствования (reason
                    = reorganization). В иных случаях не используется.'
                  type: integer
                aggregates:
                  description: 'Массив КА, подлежащих передаче новому владельцу. Примечание: Заполняется, если не указан labels.'
                  items:
                    description: КА
                    type: string
                  type: array
                comment:
                  description: Комментарий, примечание
                  type: string
                document_date:
                  description: 'Дата документа-основания. Формат: YYYY-MM-DD. Примечание: Обязательно, если причина смены
                    владельца reason = reorganization. Может быть заполнено в иных случаях.'
                  format: date
                  type: string
                document_number:
                  description: Номер документа-основания
                  type: string
                document_type:
                  description: 'Вид документа-основания. Код значения перечисления shippingDocs, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.3). Допустимые значения: aktreorg – акт передачи;
                    ttn – товарно-транспортная накладная (ТТН); tnttn – товарная накладная (ТН); ettn – электронная товарно-транспортная
                    накладная (эТТН); etn – электронная товарная накладная (эТН). Примечание: Обязательно, если причина смены
                    владельца reason = reorganization. Может быть заполнено в иных случаях.'
                  enum:
                  - aktreorg
                  - ttn
                  - tnttn
                  - ettn
                  - etn
                  type: string
                group:
                  description: 'Товарная группа (перечень значений приведен таблице 4.2.1.2). Примечание: Обязательно указывается
                    только если выполняется смена владельца маркированного товара (reason = change_owner_goods). В иных случаях
                    не используется.'
                  type: string
                labels:
                  description: 'Массив КМ, подлежащих передаче новому владельцу. Ограничения: 1. Не более 100 000 КМ или знаков
                    на 1 запрос; 2. КМ или знаки должны быть одного типа LabelType (см. п. 4.2.2); 3. При смене владельца
                    в случае реорганизации субъекта хозяйствования (reason = reorganization): 3.1. КМ или знаки должны принадлежать
                    прежнему владельцу, указанному в атрибуте agent; 3.2. КМ или знаки не должны быть использованными для
                    маркировки товара или списанными (status.code < 50); 4. При смене владельца маркированного товара (reason
                    = change_owner_goods): 4.1. КМ или знаки должны быть из одной товарной группы Group (см. п. 4.2.1); 4.2.
                    КМ или знаки использованы для маркировки товара и товар находятся в обороте (status.code = 50 или 55).
                    Примечание: Заполняется, если не указан aggregates.'
                  items:
                    description: КМ
                    type: string
                  maxItems: 100000
                  type: array
                reason:
                  description: 'Причина смены владельца. Код значения перечисления change_of_owner, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.7): reorganization – реорганизация; change_owner_goods
                    – смена владельца товара. Примечание: Значение параметра определяет состав и обязательность заполнения
                    отдельных атрибутов.'
                  enum:
                  - reorganization
                  - change_owner_goods
                  type: string
              required:
              - reason
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                report_id: c364a0ac-9458-41d7-9aed-8c63d9b957af
              schema:
                properties:
                  report_id:
                    description: UID, уникальный идентификатор отчёта о смене владельца (report_type = 15)
                    type: string
                type: object
          description: Успешное выполнение запроса
        default:
          content:
            application/json; charset=utf-8:
              schema:
