  /v3/reports/get_params_mark:
    post:
      description: 'Метод «Состав параметров маркировки» (п. 3.5.17, API версии v3). Возвращает перечень параметров маркировки
        для соответствующей группы товаров и типа отчёта. Представлений А/Б у метода в документе нет, но структура ответа
        зависит от запрошенного типа отчёта (см. oneOf в схеме result_catalog_params): для report_type = 1 (отчёт о маркировке
        / групповой маркировке) — объект с наборами параметров по целям маркировки; для report_type = 6 (отчёт о маркировке
        остатков) — массив параметров.'
      operationId: getMarkParams
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              group: telephone
              report_type: 1
            schema:
              properties:
                group:
                  description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
                  example: telephone
                  type: string
                report_type:
                  description: 'Тип отчёта, для которого запрашивается состав параметров маркировки. ID типа отчёта, полученный
                    из метода /v2/reports/types (см. п. 3.5.7; перечень значений приведен таблице 4.2.8.2). Допустимые значения:
                    1 – отчёт о маркировке / групповой маркировке; 6 – отчёт о маркировке остатков.'
                  enum:
                  - 1
                  - 6
                  type: integer
              required:
              - group
              - report_type
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                variant1_report_type_1:
                  summary: Вариант 1. Состав параметров маркировки для отчёта о маркировке / групповой маркировке (report_type
                    = 1)
                  value:
