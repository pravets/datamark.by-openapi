  securitySchemes:
    apiKey:
      description: Токен авторизации, возвращаемый методом /auth
      in: header
      name: Token
      type: apiKey
info:
  contact:
    email: support@datamark.by
    name: Техническая поддержка datamark.by
  description: 'Web-сервис межсистемного взаимодействия ГИС «Электронный знак» (государственная

    информационная система маркировки товаров унифицированными контрольными знаками

    или средствами идентификации) РУП «Издательство «Белбланкавыд».


    API предназначен для взаимодействия учётных информационных систем участников

    оборота с ГИС «Электронный знак» по API-протоколу в рамках клиент-серверной

    REST-архитектуры по защищённому HTTPS-соединению (TLS не ниже 1.2).


    Тело HTTP-запроса и HTTP-ответа по умолчанию формируется в формате JSON,

    данные передаются и обрабатываются в кодировке UTF-8

    (Content-Type: application/json; charset=utf-8).


    Аутентификация участника оборота в рамках текущей HTTP-сессии осуществляется

    по уникальному API-ключу (токену авторизации), передаваемому в заголовке Token.


    Документация: https://datamark.by/dokumenti/

    '
  title: ГИС «Электронный знак» — API маркировки и оборота товаров
  version: '4.25'
openapi: 3.0.3
paths:
  /auth:
    post:
      description: 'Авторизация пользователя в ГИС «Электронный знак». Возвращает токен авторизации, резервный токен авторизации
        и данные авторизованного пользователя. Согласно документу, заголовок HTTP-запроса Content-Type допускает три варианта:
        multipart/form-data; boundary=..., application/x-www-form-urlencoded, application/json; charset=utf-8.'
      operationId: auth
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              password: '********'
              user_info_id: 129
              username: truster@bbv.by
            schema: &id001
              properties:
                is_rules_agree:
                  description: 'Признак ознакомления и принятия условий публичного договора на реализацию СИ и оказания услуг
                    по предоставлению и учёту КМ в ГИС «Электронный знак» (факт присоединения к публичному договору, опубликованному
                    на официальном сайте Оператора): True – да; False – нет. Указывается единожды при первой авторизации либо
                    если в ответе не выдан токен авторизации.'
                  type: boolean
                password:
                  description: Пароль пользователя
                  example: '********'
                  type: string
                user_info_id:
                  description: 'ID участника оборота (Доверителя), за которого Поверенным осуществляются операции в ГИС «Электронный
                    знак», полученный из метода /principalList (см. п. 3.1.4). Обязательность в документе указана как «Да/Нет»
                    (условная): используется только участником оборота с ролью «Поверенный» (role = truster) при осуществлении
                    им операций в ГИС «Электронный знак» за другого участника (Доверителя) на основании договорных отношений
                    между ними при наличии действующей записи в реестре поручений. Успешная авторизация Поверенного осуществляется,
                    если выбранным Доверителем ему предоставлено право осуществления операций. Доступ Поверенного к операциям
                    Доверителя прекращается при исключении Доверителем соответствующей записи из реестра поручений.'
                  example: 129
                  type: integer
                username:
                  description: e-mail пользователя
                  example: truster@bbv.by
                  type: string
              required:
              - username
              - password
              type: object
          application/x-www-form-urlencoded:
            schema: *id001
          multipart/form-data:
            schema: *id001
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                token: eyJhbGciOiJFUzI1NiIsInR8cCI6IkpXVCJ9.eyJleHAiOjE3NTg3MDQ1MjIsImlhdCI6MTc1ODcwMzMyMn0.fC8PI-FTaCr5DjlDowGvyZtEiDmn6WttOR2gEQXUPTSb42DLK
                token_refresh: eyJhbGci1iJFUzI1NiIsInR5cCI6IkpXVCJ6.eyJleHAiOjE3NTkzMDgxMjIsImlhdCI6MTc1ODcwMzMyMn0.Jry66MVmJDbxNe3nt1KAiTus_8nSH1rs_kiwgk6FX2udEczteD
                user:
                  email: matohasvitok@bbv.by
                  expires_in: '2023-05-24 11:21:37'
                  id: 507
                  info:
                    address: г. Минск,ул. Тимирязева, д.2, ком. 16
                    country: '112'
                    email: info@bbv.by
                    gln: '4811612900000'
                    id: 129
                    is_partly_blocked: false
                    is_rules_agree: true
                    name: СООО "Свиток"
                    status: 1
                    substituted: false
                    unp: '190704463'
                  info_id: 129
                  lastname: Матоха
                  name: Валерий
                  need_change_password: false
                  role:
                    code: exporter
                    description: Участник оборота товаров
                  status: 1
              schema:
                properties:
                  token:
                    description: Токен авторизации. Возвращается, если пользователь ознакомился, согласился и принял условия
                      публичного договора (is_rules_agree = True). По умолчанию срок действия токена составляет 20 минут с
                      момента успешной авторизации и может быть изменён Оператором без уведомления. Дата и время истечения
                      срока действия указывается в ответе в реквизите expires_in объекта User. При истечении срока действия
                      токена необходимо повторно выполнить авторизацию и получить новый токен.
                    type: string
                  token_refresh:
                    description: Резервный токен авторизации. При работе с методами API не используется.
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                type: object
          description: Успешная авторизация
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка выполнения запроса (см. раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP
            4XX). Тело ответа — единая схема ErrorResponse.
      security: []
      summary: Авторизация
      tags:
      - Авторизация и делегирование
