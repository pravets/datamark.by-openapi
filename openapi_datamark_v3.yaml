  /v3/labels/addAggregate:
    post:
      description: 'Представление Б метода «Регистрация собственных кодов агрегации» (п. 3.4.1.2). Регистрирует сформированные
        участником оборота собственные коды агрегации (КА); в ответе возвращаются номер (идентификатор) заказа и итоги. Представление
        А того же метода доступно по адресу /v2/labels/addAggregate (п. 3.4.1.1). Примечания: 1. КА проверяется на уникальность
        в рамках ГИС «Электронный знак». 2. Для генерации КА в формате SSCC используется метод заказа кодов /v3/orders/add
        (см. п. 3.3.1.2) с типом кода label_type = 6. 3. Для собственных КА, формируемых и передаваемых участниками оборота,
        автоматически присваивается значение типа кода label_type = 13.'
      operationId: addAggregateV3
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              aggregate:
              - "1323010520222111\x1D4144811612900000422112"
              - "1323010520222112\x1D4144811612900000422112"
              - "1323010520222119\x1D4144811612900000422112"
            schema:
              properties:
                aggregate:
                  description: 'Массив (перечень) КА, сформированных участником оборота. Ограничения: 1. Длина КА – от 21
                    до 74 символов. 2. Не более 1 000 КА на 1 запрос.'
                  items:
                    description: Код агрегации (КА), длина от 21 до 74 символов
                    maxLength: 74
                    minLength: 21
                    type: string
                  maxItems: 1000
                  type: array
              required:
              - aggregate
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                created_at: '2025-01-13 10:00:57'
                failed: 3
                id: 2000489512
                success: 6
              schema:
                properties:
                  created_at:
                    description: Дата и время создания заказа
                    format: date-time
                    type: string
                  failed:
                    description: Количество ошибочных (отклоненных) КА
                    type: integer
                  id:
                    description: Номер (идентификатор) заказа
                    type: integer
                  success:
                    description: Количество успешно добавленных КА
                    type: integer
                type: object
          description: Результат регистрации собственных кодов агрегации
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Регистрация собственных кодов агрегации (Представление Б)
      tags:
      - Коды и знаки
  /v3/labels/destroy:
    post:
      description: Вариант 2 метода «Списание кодов или знаков» (п. 3.4.4.2). Применяется для списания кодов (КМ или КА) или
        знаков (УКЗ, ЗМН или ЗЗ) по причинам, отличным от их использования для целей маркировки товаров (например, порча,
        утеря, хищение, по решению субъекта хозяйствования либо иным причинам). Запрос должен обязательно содержать хотя бы
        один из параметров, в которых перечислены коды ("labels" для КМ, серий и номеров бланков УКЗ, ЗМН или ЗЗ либо "aggregates"
        для КА). Вариант 1 метода доступен по адресу /labels/destroy (п. 3.4.4.1).
      operationId: destroyLabelsV3
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              document_date: '2025-01-12'
              document_number: 2а
              document_type: akt
              label_type: 7
              labels:
              - "0100625273050882215<AID7N0Td05T\x1D91FFD0\x1D92dGVzdBUtbl+pU+1oajFxrtPOKkvMoaRYA0cQyD+IWEc="
              - "0100625273050882215JKLDGHJT(34Q\x1D91FFD0\x1D92dGVzdO6uV4PpGZGxDqZMgE++H9WeH7vMnBbvv1MGCHg="
              reason: damage
              transaction_date: '2025-01-10'
            schema:
              properties:
                aggregates:
                  description: 'Массив КА, подлежащих списанию. Примечания: 1. Заполняется, если не указан label. 2. При списании
                    КА также списываются все вложенные в агрегат КМ или КА, в том числе на нижних уровнях вложенности'
                  items:
                    description: Код агрегации (КА)
                    type: string
                  type: array
                comment:
                  description: Комментарий к операции списания
                  type: string
                document_date:
                  description: 'Дата документа-основания, подтверждающего факт списания. Формат: YYYY-MM-DD'
                  format: date
                  type: string
                document_number:
                  description: Номер документа-основания, подтверждающего факт списания
                  type: string
                document_type:
                  description: Вид документа-основания, подтверждающего факт списания. Код значения перечисления shippingDocs,
                    полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.3)
                  enum:
                  - akt
                  - aktnedost
                  - aktreorg
                  - invalid_doc
                  - invoice
                  - customs
                  - statdeclaracia
                  - ttn
                  - tnttn
                  - ettn
                  - etn
                  type: string
                label_type:
                  description: 'Тип списываемых кодов или знаков, в том числе вложенных в упаковки (агрегаты). ID кода, полученный
                    из метода /labels/types (см. п. 3.4.3; перечень значений приведен таблице 4.2.2.2). Примечание: для списания
                    «пустых» упаковок (агрегатов) используется тип кода label_type = 6 или 13'
                  enum:
                  - 6
                  - 7
                  - 12
                  - 13
                  - 16
                  - 17
                  - 18
                  - 19
                  - 20
                  - 21
                  - 24
                  - 25
                  - 26
                  - 29
                  - 30
                  type: integer
                labels:
                  description: 'Массив КМ либо серий и номеров УКЗ, ЗМН или ЗЗ, подлежащих списанию. Ограничение: не более
                    100 000 кодов на 1 запрос. Примечание: заполняется, если не указан aggregates'
                  items:
                    description: КМ либо серия и номер УКЗ, ЗМН или ЗЗ
                    type: string
                  maxItems: 100000
                  type: array
                reason:
                  description: 'Причина списания. Код значения перечисления reasons, полученного методом /directories/{:code}
                    (см. п. 3.8.3; перечень значений приведен таблице 4.3.4). Примечания: 1. За исключением «Использование
                    (маркировка)» (reason = usemark) – выбор указанной причины списания не допускается. 2. Для списания «пустых»
                    упаковок (агрегатов) указывается причина «Списание кода агрегации» (reason = Writing_aggregation_code)'
                  enum:
                  - damage
                  - destruction
                  - liquidation
                  - lost
                  - mns
                  - other
                  - spoilage
                  - theft
                  - Writing_aggregation_code
                  type: string
                transaction_date:
                  description: 'Дата операции. Формат: YYYY-MM-DD'
                  format: date
                  type: string
              required:
              - transaction_date
              - label_type
              - reason
              - document_type
              - document_date
              - document_number
              type: object
        required: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              example:
                report_id: 5443
                report_uid: 0d3e86d3-ddf0-4664-a612-4fa9130bd7df
              schema:
                properties:
                  report_id:
                    description: ID отчёта
                    type: integer
                  report_uid:
                    description: UID, уникальный идентификатор отчёта о списании кодов или знаков (report_type = 11)
                    type: string
                type: object
          description: Результат постановки кодов или знаков на списание
        default:
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание»)
            Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
      security:
      - apiKey: []
      summary: Списание кодов или знаков (Вариант 2)
      tags:
      - Коды и знаки
