      description: 'Метод «Список заказов» (п. 3.3.3). Представление Б — версия API v3

        (п. 3.3.3.2), фильтры передаются в строке запроса, ответ пагинирован

        (next / previous / results).

        Представление А (п. 3.3.3.1) — POST /orders/list.

        Примеры строки запроса из документа:

        отбор по параметрам: /v3/orders/list?page=2&ordering=-created_at&start_date=2024-11-29&end_date=2024-11-29&type_id=7

        поиск по номеру заказа: /v3/orders/list?search=2000488178

        '
      operationId: getOrdersListV3
      parameters:
      - description: Номер страницы перечня заказов
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Число записей на странице. Примечание: Максимум – до 200, по умолчанию – до 15 на 1 страницу'
        in: query
        name: page_size
        required: false
        schema:
          default: 15
          maximum: 200
          type: integer
      - description: 'Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию
          даты и времени создания; id – по возрастанию номера (идентификатора) заказа; -id – по убыванию номера (идентификатора)
          заказа'
        in: query
        name: ordering
        required: false
        schema:
          enum:
          - created_at
          - -created_at
          - id
          - -id
          type: string
      - description: 'Начальная дата интервала. Формат: YYYY-MM-DD'
        in: query
        name: start_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Конечная дата интервала. Формат: YYYY-MM-DD'
        in: query
        name: end_date
        required: false
        schema:
          format: date
          type: string
      - description: 'Начальная дата выполнения заказов. Формат: YYYY-MM-DD Примечание: Выводятся заказы, завершенные после
          указанной даты'
        in: query
        name: start_completed_at
        required: false
        schema:
          format: date
          type: string
      - description: 'Конечная дата выполнения заказов. Формат: YYYY-MM-DD Примечание: Выводятся заказы, завершенные до указанной
