info:
  name: Информация о контрагенте
  type: http
  seq: 2
  tags:
    - Контрагенты

http:
  method: POST
  url: "{{baseUrl}}/contracts/agent"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Сведения о контрагенте. Объект класса Agent (см. п. 4.1.2)
    request:
      url: "{{baseUrl}}/contracts/agent"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "address": "Могилевская обл., г. Бобруйск, ш. Минское, д. 4",
            "country": "112",
            "gln": "4811644900009",
            "id": 176,
            "is_verified": true,
            "name": "Открытое акционерное общество \"Белшина\"",
            "unp": "700016217"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/contracts/agent"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Информация о контрагенте» (п. 3.6.1). Возвращает сведения о контрагенте по его идентификатору (УНП, ИНН либо иному аналогичному идентификатору).
