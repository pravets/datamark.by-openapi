info:
  name: Добавление нового контрагента
  type: http
  seq: 1
  tags:
    - Контрагенты

http:
  method: PUT
  url: "{{baseUrl}}/contracts/addAgent"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Сведения о контрагенте. Объект класса Agent (см. п. 4.1.2)
    request:
      url: "{{baseUrl}}/contracts/addAgent"
      method: PUT
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "address": "ул. Милашенкова, д. 4 корп. 7, г. Москва",
            "country": "643",
            "gln": "4630019409950",
            "id": 18413,
            "is_verified": false,
            "name": "ООО \"УНИВЕРСАЛ-ТРЕЙДИНГ\"",
            "unp": 274068089
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/contracts/addAgent"
      method: PUT
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Добавление нового контрагента» (п. 3.6.2). Регистрирует нового контрагента и возвращает сведения о нем (объект класса Agent, см. п. 4.1.2).
