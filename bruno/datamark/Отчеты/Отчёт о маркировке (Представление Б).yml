info:
  name: Отчёт о маркировке (Представление Б)
  type: http
  seq: 22
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addMark"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Вариант 1. Маркировка телефонов и машин вычислительных (group = telephone))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 23177,
            "report_uid": "4d43a57e-f1ed-4c27-8f1d-b854c6c44274"
          }
  - name: 200 Response (Вариант 2. Маркировка молочной продукции с переменным весом (group = milk))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 23177,
            "report_uid": "4d43a57e-f1ed-4c27-8f1d-b854c6c44274"
          }
  - name: default Response (Вариант 1. Маркировка телефонов и машин вычислительных (group = telephone))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }
  - name: default Response (Вариант 2. Маркировка молочной продукции с переменным весом (group = milk))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о маркировке» (п. 3.5.1). Для данного пути канонически применяется Представление Б (п. 3.5.1.2, API версии v3). Альтернативное Представление А (п. 3.5.1.1, API версий v1/v2) применяется по пути /v2/reports/addMark. В документе явное соответствие товарных групп представлениям не указано: в примерах Представления Б использованы товарные группы telephone и milk, в примере Представления А — milk."
