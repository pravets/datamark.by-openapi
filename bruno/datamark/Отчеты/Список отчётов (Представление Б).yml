docs: Представление Б метода «Список отчётов» (п. 3.5.6.2). Возвращает постраничный перечень отчётов и результатов их обработки с отбором по типу отчёта, датам создания/операции/документа-основания, причине, номеру документа-основания, товарной группе, GTIN, UID отчёта и статусу. Состав атрибутов элементов ответа зависит от типа отчёта и результатов его выполнения; могут содержаться дополнительные сведения. Представление А метода (перечень состояний отчётов без пагинации) доступно по адресу /v2/reports/list (п. 3.5.6.1).
