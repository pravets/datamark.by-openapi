info:
  name: Отчёт о параметрах производства (Представление А)
  type: http
  seq: 6
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addManufacture"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addManufacture"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "2eb185e6-ca27-401d-b21f-1363d7f0c195"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addManufacture"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Отчёт о параметрах производства» (п. 3.5.14). Для данного пути применяется Представление А (п. 3.5.14.1, API версии v2). Альтернативное Представление Б (п. 3.5.14.2, API версии v3) доступно по пути /v3/reports/addManufacture. Представление А доступно только для товарных групп «Вода упакованная» (group = water) и «Безалкогольные напитки и соки» (group = juice, в части КМ, заказанных и полученных до 10.10.2025); в примере Представления Б использованы товарные группы dietary_supplements и telephone.
