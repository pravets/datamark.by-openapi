docs: "Вариант 2 метода «Статус выполнения отчётов» (п. 3.5.5.2). Возвращает перечень отчётов любого типа и результаты их обработки по списку уникальных идентификаторов (UID), а также перечень не найденных UID. В документе приведены два варианта представления результатов: Представление А (сокращённые счётчики обработки КМ: success/failed) и Представление Б (расширенные счётчики: all/failed/success/aggregated, а также GTIN). Критерий отнесения отчёта к представлению А или Б в документе явно не указан (см. oneOf в схеме поля result). Вариант 1 метода (запрос одного отчёта) доступен по адресу /v2/reports (п. 3.5.5.1)."
