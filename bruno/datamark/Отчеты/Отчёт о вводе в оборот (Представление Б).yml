docs: "Метод «Отчёт о вводе в оборот» (п. 3.5.9). Для данного пути применяется Представление Б (п. 3.5.9.2, API версии v3). Альтернативное Представление А (п. 3.5.9.1, API версии v2) доступно по пути /v2/reports/addMarkCirculation и допускает также причину import_third_countries (ввоз из третьих стран). Явная привязка товарных групп к представлениям в документе не указана: в примерах Представления Б использованы товарные группы juice и telephone («Телефоны и машины вычислительные»); для товарных групп, требующих дополнительные параметры, labels передается массивом объектов (см. oneOf в схеме labels и примеры)."
