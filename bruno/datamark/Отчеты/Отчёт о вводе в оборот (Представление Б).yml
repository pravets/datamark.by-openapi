info:
  name: Отчёт о вводе в оборот (Представление Б)
  type: http
  seq: 23
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addMarkCirculation"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

