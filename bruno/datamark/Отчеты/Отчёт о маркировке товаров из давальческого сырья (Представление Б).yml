info:
  name: Отчёт о маркировке товаров из давальческого сырья (Представление Б)
  type: http
  seq: 25
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addMarkTrans"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addMarkTrans"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 83978,
            "report_uid": "6094b1c8-47c8-49bc-8658-d10c43c78231"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/reports/addMarkTrans"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о маркировке товаров из давальческого сырья» (п. 3.5.12). Для данного пути применяется Представление Б (п. 3.5.12.2, API версии v3). Альтернативное Представление А (п. 3.5.12.1, API версии v2) доступно по пути /v2/reports/addMarkTrans и не содержит ограничений на тип и количество КМ. Явная привязка товарных групп к представлениям в документе не указана: в примерах обоих представлений использована товарная группа milk."
