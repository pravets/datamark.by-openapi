docs: 'Представление Б метода «Список использованных кодов» (п. 3.5.8.2). Возвращает перечень КМ или КА, использованных при формировании и обработке отчёта, по идентификатору (ID) или уникальному идентификатору (UID) отчёта и типу возвращаемых сведений (file_type). В случае ошибочных КМ или КА дополнительно может быть указано описание ошибки. Примечание: Запрос должен обязательно содержать хотя бы один из параметров, идентифицирующих отчёт ("report_id" либо "report_uid"), по которому запрашиваются сведения об использованных КМ или КА. Представление А метода доступно по адресу /v2/reports/labels (п. 3.5.8.1).'
