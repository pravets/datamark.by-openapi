info:
  name: Отчёт о маркировке остатков (Представление А)
  type: http
  seq: 9
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addMarkLeftovers"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addMarkLeftovers"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "9f7a3581-9447-425a-a931-49412b3fdb19"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addMarkLeftovers"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о маркировке остатков» (п. 3.5.10). Для данного пути применяется Представление А (п. 3.5.10.1, API версии v2). Альтернативное Представление Б (п. 3.5.10.2, API версии v3) доступно по пути /v3/reports/addMarkLeftovers. Явная привязка товарных групп к представлениям в документе не указана: в примере Представления А использована товарная группа shoes, в примере Представления Б — telephone. Примечание документа: применение методов возможно только с даты введения обязательной маркировки и становится недоступным после окончания периода времени передачи информации о нанесении СИ на остатки товаров, установленные для соответствующей товарной группы."
