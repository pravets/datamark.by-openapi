info:
  name: Использование УКЗ
  type: http
  seq: 11
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addUsed"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addUsed"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "4cd57fc9-0fef-4857-988d-621e6ecbbedc"
          }
  - name: default Response
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addUsed"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Использование УКЗ» (п. 3.5.4). В документе описан только для пути /v2/reports/addUsed, деление на представления отсутствует.
