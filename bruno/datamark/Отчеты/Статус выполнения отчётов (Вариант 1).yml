info:
  name: Статус выполнения отчётов (Вариант 1)
  type: http
  seq: 1
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

