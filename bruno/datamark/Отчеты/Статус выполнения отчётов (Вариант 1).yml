docs: "Вариант 1 метода «Статус выполнения отчётов» (п. 3.5.5.1). Возвращает состояние одного отчёта по его уникальному идентификатору (UID): даты создания и последнего обновления, ID типа отчёта, товарную группу, текущий статус (объект класса ReportStatus, см. п. 4.2.5) и представление результатов обработки отчёта. Состав атрибутов результата (поле result) зависит от типа отчёта и результатов его выполнения; могут содержаться дополнительные сведения. Вариант 2 метода (пакетный запрос статусов по списку UID) доступен по адресу /v3/reports (п. 3.5.5.2)."
