info:
  name: Отчёт о маркировке товаров из ЕАЭС
  type: http
  seq: 20
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addGroupMarkImportEAS"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addGroupMarkImportEAS"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 23177,
            "report_uid": "4d43a57e-f1ed-4c27-8f1d-b854c6c44274"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/reports/addGroupMarkImportEAS"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Отчёт о маркировке товаров из ЕАЭС» (п. 3.5.18, API версии v3). Метод предназначен для товарной группы juice «Безалкогольные напитки и соки» ТН ВЭД ЕАЭС 2202. Представлений А/Б у метода в документе нет.
