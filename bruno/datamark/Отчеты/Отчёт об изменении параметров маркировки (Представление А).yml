info:
  name: Отчёт об изменении параметров маркировки (Представление А)
  type: http
  seq: 12
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/edit"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/edit"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "67db7b9d-ed03-4347-a849-753eed01076c"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/edit"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Отчёт об изменении параметров маркировки» (п. 3.5.13). Для данного пути применяется Представление А (п. 3.5.13.1, API версии v2). Альтернативное Представление Б (п. 3.5.13.2, API версии v3) доступно по пути /v3/reports/edit и позволяет корректировать также индивидуальные параметры маркировки отдельных КМ. Явная привязка товарных групп к представлениям в документе не указана.
