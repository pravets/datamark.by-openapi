info:
  name: Состав параметров маркировки
  type: http
  seq: 29
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/get_params_mark"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

