docs: "Метод «Состав параметров маркировки» (п. 3.5.17, API версии v3). Возвращает перечень параметров маркировки для соответствующей группы товаров и типа отчёта. Представлений А/Б у метода в документе нет, но структура ответа зависит от запрошенного типа отчёта (см. oneOf в схеме result_catalog_params): для report_type = 1 (отчёт о маркировке / групповой маркировке) — объект с наборами параметров по целям маркировки; для report_type = 6 (отчёт о маркировке остатков) — массив параметров."
