docs: Метод «Отчёт о параметрах производства» (п. 3.5.14). Для данного пути применяется Представление Б (п. 3.5.14.2, API версии v3). Альтернативное Представление А (п. 3.5.14.1, API версии v2) доступно по пути /v2/reports/addManufacture (только для товарных групп water и juice). В примерах Представления Б использованы товарные группы dietary_supplements и telephone («Телефоны и машины вычислительные»); для товарных групп, требующих дополнительные параметры, labels передается массивом объектов (см. oneOf в схеме labels и примеры).
