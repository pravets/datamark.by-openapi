info:
  name: Отчёт о параметрах производства (Представление Б)
  type: http
  seq: 21
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addManufacture"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Вариант 1. Отчёт о параметрах производства)
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addManufacture"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 3684,
            "report_uid": "fcacc009-a2ac-49b8-9271-71669eefec21"
          }
  - name: 200 Response (Вариант 2. Отчёт о параметрах производства для товарной группы «Телефоны и машины вычислительные»)
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/addManufacture"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
