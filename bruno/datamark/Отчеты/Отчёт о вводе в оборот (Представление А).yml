info:
  name: Отчёт о вводе в оборот (Представление А)
  type: http
  seq: 8
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addMarkCirculation"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addMarkCirculation"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "9f7a3581-9447-425a-a931-49412b3fdb19"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addMarkCirculation"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о вводе в оборот» (п. 3.5.9). Для данного пути применяется Представление А (п. 3.5.9.1, API версии v2). Альтернативное Представление Б (п. 3.5.9.2, API версии v3) доступно по пути /v3/reports/addMarkCirculation и допускает только причину ввода в оборот import (ввоз из стран ЕАЭС). Явная привязка товарных групп к представлениям в документе не указана: в примере Представления А использована товарная группа shoes, в примерах Представления Б — juice и telephone. Состав объекта params зависит от причины ввода в оборот: для circulation_reason = import — вариант «Ввоз из стран ЕАЭС», для circulation_reason = import_third_countries — вариант «Ввоз из третьих стран» (см. oneOf)."
