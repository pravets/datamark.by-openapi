docs: "Представление А метода «Список отчётов» (п. 3.5.6.1). Возвращает перечень состояний отчётов заданного типа: не более 100 последних сформированных отчётов. Для отчётов о смене владельца (report_type = 15) доступен дополнительный отбор по причине смены владельца (параметр reason). Представление Б метода (постраничный список с расширенными фильтрами) доступно по адресу /v3/reports/list (п. 3.5.6.2)."
