info:
  name: Отчёт о маркировке (Представление А)
  type: http
  seq: 7
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addMark"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Представление А. Маркировка молочной продукции (group = milk))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "22331fa0-740c-4307-80a7-10b24827d9ff"
          }
  - name: default Response (Представление А. Маркировка молочной продукции (group = milk))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о маркировке» (п. 3.5.1). Для данного пути канонически применяется Представление А (п. 3.5.1.1, API версий v1/v2). Альтернативное Представление Б (п. 3.5.1.2, API версии v3) применяется по пути /v3/reports/addMark. В документе явное соответствие товарных групп представлениям не указано: в примере Представления А использована товарная группа milk, в примерах Представления Б — telephone и milk."
