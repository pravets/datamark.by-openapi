info:
  name: Список использованных кодов (Представление А)
  type: http
  seq: 13
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/labels"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень КМ, КА либо серий и номеров УКЗ, использованных при формировании отчёта
    request:
      url: "{{baseUrl}}/v2/reports/labels"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "labels": [
              "0104810223007436212PWKhQkD\u001d931qxa",
              "0104810223007436212PWKhQk5\u001d93RaEC",
              "0104810223007436212PWKhQWS\u001d932AxX"
            ],
            "report_id": "a83e9a31-d025-4927-9d6f-95d7fae5d58e"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/labels"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Представление А метода «Список использованных кодов» (п. 3.5.8.1). Возвращает перечень КМ, КА либо серий и номеров УКЗ, использованных при формировании отчёта, по уникальному идентификатору отчёта (UID). Представление Б метода (выгрузка файлов по типу сведений) доступно по адресу /v3/reports/downloads (п. 3.5.8.2).
