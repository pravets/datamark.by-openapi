info:
  name: Отчёт об агрегировании (Представление А)
  type: http
  seq: 2
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addAggregate"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Вариант 1. Агрегация начального уровня (коды маркировки))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "22331fa0-740c-4307-80a7-10b24827d9ff"
          }
  - name: 200 Response (Вариант 2. Агрегация второго и последующих уровней (вложенные коды агрегации))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "22331fa0-740c-4307-80a7-10b24827d9ff"
          }
  - name: default Response (Вариант 1. Агрегация начального уровня (коды маркировки))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }
  - name: default Response (Вариант 2. Агрегация второго и последующих уровней (вложенные коды агрегации))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт об агрегировании» (п. 3.5.3). Для данного пути канонически применяется Представление А (п. 3.5.3.1, API версий v1/v2). Альтернативное Представление Б (п. 3.5.3.2, API версии v3) применяется по пути /v3/reports/addAggregate. Примечание: в Представлении А параметр group отсутствует, в Представлении Б — необязателен."
