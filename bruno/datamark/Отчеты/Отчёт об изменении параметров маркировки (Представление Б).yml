docs: Метод «Отчёт об изменении параметров маркировки» (п. 3.5.13). Для данного пути применяется Представление Б (п. 3.5.13.2, API версии v3). Альтернативное Представление А (п. 3.5.13.1, API версии v2) доступно по пути /v2/reports/edit и допускает корректировку только общих параметров (массивом объектов code/value). Явная привязка товарных групп к представлениям в документе не указана.
