info:
  name: Отчёт об изменении параметров маркировки (Представление Б)
  type: http
  seq: 28
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/edit"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Вариант 1. Корректировка общих параметров маркировки)
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/edit"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 28058,
            "report_uid": "08d5f5d5-fc65-419d-a765-fe55ead5b365"
          }
