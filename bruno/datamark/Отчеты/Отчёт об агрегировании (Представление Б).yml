info:
  name: Отчёт об агрегировании (Представление Б)
  type: http
  seq: 17
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addAggregate"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

