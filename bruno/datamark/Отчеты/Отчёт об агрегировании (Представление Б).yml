docs: "Метод «Отчёт об агрегировании» (п. 3.5.3). Для данного пути канонически применяется Представление Б (п. 3.5.3.2, API версии v3). Альтернативное Представление А (п. 3.5.3.1, API версий v1/v2) применяется по пути /v2/reports/addAggregate. Примечание: в Представлении Б параметр group необязателен, а поля labels и aggregates имеют условную обязательность («Да/Нет» — предположительно, заполняется хотя бы один из массивов)."
