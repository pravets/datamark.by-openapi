info:
  name: Отчёт об удалении кодов из агрегата
  type: http
  seq: 26
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/aggregateDelete"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v3/reports/aggregateDelete"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": 5459,
            "report_uid": "eb1e7507-aa31-4021-ba8e-f6c4b4331d9a"
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/reports/aggregateDelete"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: 'Метод «Отчёт об удалении кодов из агрегата» (п. 3.5.16, API версии v3). Исключает перечисленные КМ или КА из агрегата с возможностью разрушения вышестоящего агрегата. Представлений А/Б у метода в документе нет. Примечание документа: запрос должен обязательно содержать хотя бы один из параметров, в которых перечислены коды ("labels" для КМ либо "aggregates" для КА).'
