docs: 'Метод «Отчёт о смене владельца» (п. 3.5.15). Для данного пути применяется Представление Б (п. 3.5.15.2, API версии v3). Альтернативное Представление А (п. 3.5.15.1, API версии v2) доступно по пути /v2/reports/addChangeOwnerMade (без параметра aggregates; labels в нём обязателен). Явная привязка товарных групп к представлениям в документе не указана: в примерах Представления Б использована товарная группа dietary_supplements. Примечание документа: запрос должен обязательно содержать хотя бы один из параметров, в которых перечислены коды ("labels" для КМ либо "aggregates" для КА).'
