docs: "Метод «Отчёт о смене владельца» (п. 3.5.15). Для данного пути применяется Представление А (п. 3.5.15.1, API версии v2). Альтернативное Представление Б (п. 3.5.15.2, API версии v3) доступно по пути /v3/reports/addChangeOwnerMade и дополнительно позволяет передавать массив кодов агрегации (aggregates). Явная привязка товарных групп к представлениям в документе не указана: в примерах Представления А использована товарная группа shoes, в примерах Представления Б — dietary_supplements. Значение параметра reason определяет состав и обязательность заполнения отдельных атрибутов (см. примечания в описаниях полей)."
