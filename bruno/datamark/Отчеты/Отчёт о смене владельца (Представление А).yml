info:
  name: Отчёт о смене владельца (Представление А)
  type: http
  seq: 4
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addChangeOwnerMade"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Вариант 1. Смена владельца при реорганизации субъекта хозяйствования (reason = reorganization))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addChangeOwnerMade"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "report_id": "7ce6e142-7786-48f9-b99c-cbb25446ad73"
          }
  - name: 200 Response (Вариант 2. Смена владельца маркированного товара (reason = change_owner_goods))
