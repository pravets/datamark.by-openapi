info:
  name: Отчёт о групповой маркировке с агрегацией (Представление А)
  type: http
  seq: 5
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v2/reports/addGroupMark"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Представление А. Групповая маркировка с агрегацией молочной продукции (group = milk))
    description: Успешное выполнение запроса
    request:
      url: "{{baseUrl}}/v2/reports/addGroupMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "packages": {
              "010481026802491711200927100765\u001d370012\u001d2100600": {
                "report_id": "58ef4625-c8bf-4cdc-8d06-cf9111a36677"
              },
              "010481026802491711200927100765\u001d370012\u001d2100601": {
                "report_id": "2909732b-a9ca-4a4b-b3bd-3e18b575c9e1"
              }
            }
          }
  - name: default Response (Представление А. Групповая маркировка с агрегацией молочной продукции (group = milk))
    description: Ответ с описанием ошибки Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/reports/addGroupMark"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отчёт о групповой маркировке с агрегацией» (п. 3.5.2). Для данного пути канонически применяется Представление А (п. 3.5.2.1, API версий v1/v2). Альтернативное Представление Б (п. 3.5.2.2, API версии v3) применяется по пути /v3/reports/addGroupMark. В документе явное соответствие товарных групп представлениям не указано: в примере Представления А использована товарная группа milk, в примерах Представления Б — telephone и milk."
