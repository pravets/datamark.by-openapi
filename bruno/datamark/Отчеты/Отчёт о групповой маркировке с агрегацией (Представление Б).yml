docs: "Метод «Отчёт о групповой маркировке с агрегацией» (п. 3.5.2). Для данного пути канонически применяется Представление Б (п. 3.5.2.2, API версии v3). Альтернативное Представление А (п. 3.5.2.1, API версий v1/v2) применяется по пути /v2/reports/addGroupMark. В документе явное соответствие товарных групп представлениям не указано: в примерах Представления Б использованы товарные группы telephone и milk, в примере Представления А — milk."
