info:
  name: Отчёт о групповой маркировке с агрегацией (Представление Б)
  type: http
  seq: 19
  tags:
    - Отчеты

http:
  method: POST
  url: "{{baseUrl}}/v3/reports/addGroupMark"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
