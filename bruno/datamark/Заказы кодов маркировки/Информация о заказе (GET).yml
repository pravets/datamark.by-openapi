info:
  name: Информация о заказе (GET)
  type: http
  seq: 11
  tags:
    - Заказы кодов маркировки

http:
  method: GET
  url: "{{baseUrl}}/v3/orders/list/:id"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: id
      value: "2000488178"
      type: path
      description: "Номер заказа. ID заказа, полученный из методов /v3/orders/add (см. п. 3.3.1.2), /v3/orders/addGroupOrders (см. п. 3.3.4.2) или /v3/labels/addAggregate (см. п. 3.4.1.2). Пример строки запроса: /v3/orders/list/2000488178"
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

