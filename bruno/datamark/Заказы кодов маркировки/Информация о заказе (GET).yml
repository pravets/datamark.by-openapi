docs: |
  Метод «Информация о заказе» (п. 3.3.2). Представление Б — версия API v3
  (п. 3.3.2.2), номер заказа передаётся в строке запроса.
  Представление А (версия API v2) — POST /v2/orders (см. п. 3.3.2.1).
  Состав полей объекта Order в ответе зависит от вида заказа
  (см. примеры): заказ кодов маркировки, заказ кодов агрегации формата
  SSCC, заказ на регистрацию собственных кодов агрегации.
