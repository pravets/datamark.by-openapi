info:
  name: Список заказов
  type: http
  seq: 2
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/orders/list"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
