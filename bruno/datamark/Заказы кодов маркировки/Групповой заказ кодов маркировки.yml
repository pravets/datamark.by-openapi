info:
  name: Групповой заказ кодов маркировки
  type: http
  seq: 5
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v2/orders/addGroupOrders"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса — перечень идентификаторов заказов по каждому переданному значению GTIN
    request:
      url: "{{baseUrl}}/v2/orders/addGroupOrders"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "4810263033525": {
              "created_at": "2020-12-15 10:03:00+03:00",
              "id": "250878"
            },
            "4810268024894": {
              "created_at": "2020-12-15 10:03:00+03:00",
              "id": "250879"
            }
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/orders/addGroupOrders"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: |
  Метод «Групповой заказ кодов маркировки» (п. 3.3.4).
  Представление А — версия API v2 (п. 3.3.4.1).
  Представление Б (версия API v3, расширенный состав label_type и
  параметр template_id) — POST /v3/orders/addGroupOrders (см. п. 3.3.4.2).
  Ограничения: не более 100 GTIN на 1 запрос; не более 10 000 кодов
  на каждый GTIN; для заказа доступны только коды с типом
  label_type = 7 или 20.
