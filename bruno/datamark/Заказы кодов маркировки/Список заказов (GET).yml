info:
  name: Список заказов (GET)
  type: http
  seq: 10
  tags:
    - Заказы кодов маркировки

http:
  method: GET
  url: "{{baseUrl}}/v3/orders/list"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: page
      value: ""
      type: query
      description: Номер страницы перечня заказов
      disabled: true
    - name: page_size
      value: "15"
      type: query
      description: "Число записей на странице. Примечание: Максимум – до 200, по умолчанию – до 15 на 1 страницу"
    - name: ordering
      value: created_at
      type: query
      description: "Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию даты и времени создания; id – по возрастанию номера (идентификатора) заказа; -id – по убыванию номера (идентификатора) заказа"
      disabled: true
    - name: ordering
      value: -created_at
      type: query
      description: "Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию даты и времени создания; id – по возрастанию номера (идентификатора) заказа; -id – по убыванию номера (идентификатора) заказа"
      disabled: true
    - name: ordering
      value: id
      type: query
      description: "Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию даты и времени создания; id – по возрастанию номера (идентификатора) заказа; -id – по убыванию номера (идентификатора) заказа"
      disabled: true
    - name: ordering
      value: -id
      type: query
      description: "Условия сортировки данных: created_at – по возрастанию даты и времени создания; -created_at – по убыванию даты и времени создания; id – по возрастанию номера (идентификатора) заказа; -id – по убыванию номера (идентификатора) заказа"
      disabled: true
    - name: start_date
      value: ""
      type: query
      description: "Начальная дата интервала. Формат: YYYY-MM-DD"
      disabled: true
    - name: end_date
      value: ""
      type: query
      description: "Конечная дата интервала. Формат: YYYY-MM-DD"
      disabled: true
    - name: start_completed_at
      value: ""
      type: query
      description: "Начальная дата выполнения заказов. Формат: YYYY-MM-DD Примечание: Выводятся заказы, завершенные после указанной даты"
      disabled: true
    - name: end_completed_at
      value: ""
      type: query
      description: "Конечная дата выполнения заказов. Формат: YYYY-MM-DD Примечание: Выводятся заказы, завершенные до указанной даты"
      disabled: true
    - name: gtin
      value: ""
      type: query
      description: GTIN товара, на который сформирован заказ КМ
      disabled: true
    - name: type_id
      value: ""
      type: query
      description: Тип кода. ID кода, полученный из метода /labels/types (см. п. 3.4.3; перечень значений приведен таблице 4.2.2.2)
      disabled: true
    - name: search
      value: "2000488178"
      type: query
      description: Номер заказа. ID заказа, по которому осуществляется поиск в списке
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

