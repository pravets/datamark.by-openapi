docs: |
  Метод «Список заказов» (п. 3.3.3). Представление Б — версия API v3
  (п. 3.3.3.2), фильтры передаются в строке запроса, ответ пагинирован
  (next / previous / results).
  Представление А (п. 3.3.3.1) — POST /orders/list.
  Примеры строки запроса из документа:
  отбор по параметрам: /v3/orders/list?page=2&ordering=-created_at&start_date=2024-11-29&end_date=2024-11-29&type_id=7
  поиск по номеру заказа: /v3/orders/list?search=2000488178
