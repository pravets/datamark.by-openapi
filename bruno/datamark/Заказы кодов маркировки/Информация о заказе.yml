info:
  name: Информация о заказе
  type: http
  seq: 3
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v2/orders"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

