info:
  name: Заказ кодов (POST)
  type: http
  seq: 7
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v3/orders/add"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса — идентификатор и дата создания заказа
    request:
      url: "{{baseUrl}}/v3/orders/add"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "created_at": "2025-01-13 11:56:58",
            "id": 2000489528
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/orders/add"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: |
  Метод «Заказ кодов» (п. 3.3.1). Представление Б — версия API v3 (п. 3.3.1.2).
  Представление А (версия API v2, ответ содержит объект Order) —
  POST /v2/orders/add (см. п. 3.3.1.1).
  Ограничение: для заказа доступны только коды с типом label_type = 6
  (код агрегации SSCC); не более 1 000 кодов на 1 заказ.
