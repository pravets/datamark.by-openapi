info:
  name: Групповой заказ кодов маркировки (POST)
  type: http
  seq: 8
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v3/orders/addGroupOrders"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса — перечень идентификаторов заказов КМ
    request:
      url: "{{baseUrl}}/v3/orders/addGroupOrders"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "orders": {
              "625273050882": {
                "created_at": "2024-11-29 20:25:26",
                "id": 2000488179
              },
              "4812845008808": {
                "created_at": "2024-11-29 20:25:26",
                "id": 2000488178
              }
            }
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/orders/addGroupOrders"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: |
  Метод «Групповой заказ кодов маркировки» (п. 3.3.4).
  Представление Б — версия API v3 (п. 3.3.4.2).
  Представление А (версия API v2) — POST /v2/orders/addGroupOrders
  (см. п. 3.3.4.1).
  Ограничения: не более 100 GTIN на 1 запрос; на каждый GTIN в запросе
  в зависимости от типа кода: для label_type = 12 — не более 100 000
  кодов, для остальных типов — не более 10 000 кодов; для заказа
  доступны только коды с типом label_type = 7, 12, 20 или 24.
