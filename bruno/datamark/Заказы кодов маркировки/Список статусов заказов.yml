info:
  name: Список статусов заказов
  type: http
  seq: 6
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v2/orders/statusList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса — перечень заказов и их статусов
    request:
      url: "{{baseUrl}}/v2/orders/statusList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "orders_list": [
              {
                "completed_at": "2020-12-15 10:04:03.258072+03",
