info:
  name: Список заказанных кодов
  type: http
  seq: 9
  tags:
    - Заказы кодов маркировки

http:
  method: POST
  url: "{{baseUrl}}/v3/orders/downloads"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешное выполнение запроса — перечень КМ из заказа
    request:
      url: "{{baseUrl}}/v3/orders/downloads"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "labels": [
              "0104812845008808215CjBmJL,pugAq\u001d91FFD0\u001d92dGVzdBSSkDJP1g/BAAbCv3wv/OaXx8Fb2u5JT9pZgKc=",
              "0104812845008808215&)')WXeauGKm\u001d91FFD0\u001d92dGVzdPBTdSpuGymZRALebENUimTf271ALnTtHAC/ZFY="
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/orders/downloads"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

