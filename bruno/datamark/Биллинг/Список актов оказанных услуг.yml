info:
  name: Список актов оказанных услуг
  type: http
  seq: 1
  tags:
    - Биллинг

http:
  method: GET
  url: "{{baseUrl}}/v3/common/getUsersBillingPdfActsList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: act_type
      value: "9"
      type: query
      description: "Группа оказанных услуг. Допустимые значения: 9 – услуги по выдаче и учёту КМ; 10 – услуги доступа к сервису «Электронный кабинет»."
      disabled: true
    - name: act_type
      value: "10"
      type: query
      description: "Группа оказанных услуг. Допустимые значения: 9 – услуги по выдаче и учёту КМ; 10 – услуги доступа к сервису «Электронный кабинет»."
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Номер страницы перечня актов оказанных услуг
    - name: page_size
      value: "15"
      type: query
      description: Число записей на странице. Максимум – до 200, по умолчанию – до 15 на 1 страницу
    - name: ordering
      value: id
      type: query
      description: "Условия сортировки данных: id – по возрастанию идентификатора акта оказанных услуг; -id – по убыванию идентификатора акта оказанных услуг"
      disabled: true
    - name: ordering
      value: -id
      type: query
      description: "Условия сортировки данных: id – по возрастанию идентификатора акта оказанных услуг; -id – по убыванию идентификатора акта оказанных услуг"
      disabled: true
    - name: period_year_start
      value: "2024"
      type: query
      description: Год начала интервала расчётного периода
    - name: period_month_start
      value: "12"
      type: query
      description: Месяц начала интервала расчётного периода
    - name: period_year_end
      value: "2025"
      type: query
      description: Год окончания интервала расчётного периода
    - name: period_month_end
      value: "2"
      type: query
      description: Месяц окончания интервала расчётного периода
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

