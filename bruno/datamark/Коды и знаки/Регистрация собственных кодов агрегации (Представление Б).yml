info:
  name: Регистрация собственных кодов агрегации (Представление Б)
  type: http
  seq: 9
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/v3/labels/addAggregate"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат регистрации собственных кодов агрегации
    request:
      url: "{{baseUrl}}/v3/labels/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "created_at": "2025-01-13 10:00:57",
            "failed": 3,
            "id": 2000489512,
            "success": 6
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/labels/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Представление Б метода «Регистрация собственных кодов агрегации» (п. 3.4.1.2). Регистрирует сформированные участником оборота собственные коды агрегации (КА); в ответе возвращаются номер (идентификатор) заказа и итоги. Представление А того же метода доступно по адресу /v2/labels/addAggregate (п. 3.4.1.1). Примечания: 1. КА проверяется на уникальность в рамках ГИС «Электронный знак». 2. Для генерации КА в формате SSCC используется метод заказа кодов /v3/orders/add (см. п. 3.3.1.2) с типом кода label_type = 6. 3. Для собственных КА, формируемых и передаваемых участниками оборота, автоматически присваивается значение типа кода label_type = 13."
