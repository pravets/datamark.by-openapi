info:
  name: Список списаний
  type: http
  seq: 5
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/stats/destroyList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень списаний с текущими отборами (фильтрами)
    request:
      url: "{{baseUrl}}/stats/destroyList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "count": 302,
            "destroy_list": [
              {
                "created_at": "2021-06-17 16:28:41+03",
                "label": "019481900857000421011050791AAA",
                "message": {
                  "message": "",
                  "name": "ФН254",
                  "reason": "damage",
                  "shipping_doc": "akt"
                },
                "status": {
                  "code": null,
                  "message": null
                },
                "type": {
