info:
  name: Валидация кодов маркировки
  type: http
  seq: 6
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/v2/labels"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результаты проверки кодов маркировки
    request:
      url: "{{baseUrl}}/v2/labels"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "labels": [
              {
                "found": true,
                "is_my": true,
                "label": "0104811215019130212tSKmLjdjc6N9\u001d91TEST\u001d92testtest... testtest",
                "status": {
                  "code": 30,
                  "message": "Валидирован"
                },
                "type": {
                  "id": 20,
                  "name": "Код РБ идентификации товара (обувь, шины, легкая промышленность)"
                }
              },
              {
                "found": false,
                "label": "0104811215019130212DvkEvnDcmEdF\u001d91TEST\u001d92testtest...test"
              }
            ]
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/labels"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Валидация кодов маркировки» (п. 3.4.6). Проверяет наличие кодов маркировки (КМ) в информационной системе и возвращает текущий статус, принадлежность и тип каждого подтвержденного КМ.
