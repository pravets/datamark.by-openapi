  name: Информация о структуре и составе агрегата (Представление А)
  type: http
  seq: 2
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/labels/aggregateInfo"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

