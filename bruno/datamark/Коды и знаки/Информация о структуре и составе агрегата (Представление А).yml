docs: Представление А метода «Информация о структуре и составе агрегата» (п. 3.4.7.1). Возвращает состав агрегата в виде массива элементов; состав может включать агрегаты на нижестоящих уровнях вложенности. Представление Б того же метода доступно по адресу /v3/get_aggregate_inside (п. 3.4.7.2) и возвращает описание агрегата с деревом агрегации (объект класса Aggregate, см. п. 4.1.11). Критерии отнесения товарных групп к представлениям А/Б в документе не указаны.
