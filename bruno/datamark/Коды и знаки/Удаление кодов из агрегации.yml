info:
  name: Удаление кодов из агрегации
  type: http
  seq: 1
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/labels/aggregateDelete"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат исключения кодов из агрегации
    request:
      url: "{{baseUrl}}/labels/aggregateDelete"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "aggregate": "000481901888000000180204811309016724376\u001d1320111230987zyx",
            "count": {
              "deleted": 2,
              "failed": 0,
              "total": 4
            }
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/labels/aggregateDelete"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Удаление кодов из агрегации» (п. 3.4.2). Исключает коды маркировки (КМ) либо коды агрегации (КА) нижестоящего уровня из указанного агрегата.
