info:
  name: Регистрация собственных кодов агрегации (Представление А)
  type: http
  seq: 7
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/v2/labels/addAggregate"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат регистрации собственных кодов агрегации
    request:
      url: "{{baseUrl}}/v2/labels/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "count": {
              "failed": 2,
              "success": 98
            },
            "error": [
              "010481533023884121wbv2 already exists",
              "8974klsakbdlalk3 already exists"
            ]
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/labels/addAggregate"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Представление А метода «Регистрация собственных кодов агрегации» (п. 3.4.1.1). Регистрирует сформированные участником оборота собственные коды агрегации (КА); в ответе возвращаются итоги (количество успешных/отклоненных КА и перечень ошибок). Представление Б того же метода доступно по адресу /v3/labels/addAggregate (п. 3.4.1.2) и отличается структурой ответа (возвращаются номер заказа и итоги). Критерии отнесения товарных групп к представлениям А/Б в документе не указаны. Примечание: для генерации КА в формате SSCC используется метод заказа кодов /v2/orders/add (см. п. 3.3.1.1) с типом кода label_type = 6."
