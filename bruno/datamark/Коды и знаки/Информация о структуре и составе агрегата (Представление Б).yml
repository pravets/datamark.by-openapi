info:
  name: Информация о структуре и составе агрегата (Представление Б)
  type: http
  seq: 8
  tags:
    - Коды и знаки

http:
  method: POST
  url: "{{baseUrl}}/v3/get_aggregate_inside"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Описание и состав агрегата, в том числе дерево агрегации
    request:
      url: "{{baseUrl}}/v3/get_aggregate_inside"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "1323010520222111\u001d4144811612900000422112": {
              "aggregate_inside": {},
              "aggregates_count": 0,
              "high_aggregates": [
                {
                  "level": 2,
                  "uuid": 48116129010631670
                }
              ],
              "labels_count": 5,
              "labels_inside": [
                "0104812845008808215CjBmJL,pugAq\u001d91FFD0\u001d92dGVzdBSSkDJP1g/BAAbCv3wv/OaXx8Fb2u5JT9pZgKc=",
                "0104812845008808215j.FUYPHZM_nV\u001d91FFD0\u001d92dGVzdBslwK4e8qW5oRXvEE8W49YCi+uoC4R3REf5730="
              ],
              "level": 1,
              "status": "Агрегат содержит коды и/или агрегаты",
              "user_info": "СООО \"Свиток\""
            }
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/get_aggregate_inside"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Представление Б метода «Информация о структуре и составе агрегата» (п. 3.4.7.2). Возвращает описание и состав агрегата, в том числе дерево агрегации (структуру вложенности с учётом подчиненных КА). Представление А того же метода доступно по адресу /labels/aggregateInfo (п. 3.4.7.1).
