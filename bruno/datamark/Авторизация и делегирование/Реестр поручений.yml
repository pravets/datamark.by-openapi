info:
  name: Реестр поручений
  type: http
  seq: 7
  tags:
    - Авторизация и делегирование

http:
  method: POST
  url: "{{baseUrl}}/users/myTrusterList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Реестр поручений (перечень Поверенных)
    request:
      url: "{{baseUrl}}/users/myTrusterList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "truster_list": [
              {
                "address": "Минская обл.,Минский р-н,Щомыслицкий с/с, каб. 75,17-й км. автодороги Минск-Дзержинск, административно-бытовой корпус",
                "gln": "4815330900007",
                "id": 32,
                "name": "Минский филиал РУП \"Белтаможсервис\"",
                "unp": "101561144"
              },
              {
                "address": "г.Минск",
                "gln": "4816583261785",
                "id": 16095,
                "name": "ООО \"Марк энд компани\"",
                "unp": "500012196"
              }
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса (см. раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/users/myTrusterList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Перечень Поверенных, которым Доверителем предоставлено право осуществления операций в ГИС «Электронный знак». Входные параметры отсутствуют.
