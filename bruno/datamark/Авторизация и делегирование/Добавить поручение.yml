info:
  name: Добавить поручение
  type: http
  seq: 4
  tags:
    - Авторизация и делегирование

http:
  method: POST
  url: "{{baseUrl}}/users/addTruster"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Сведения о Поверенном
    request:
      url: "{{baseUrl}}/users/addTruster"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "address": "Минская обл.,Минский р-н,Щомыслицкий с/с, каб. 75,17-й км. автодороги Минск-Дзержинск, административно-бытовой корпус",
            "gln": "4815330900007",
            "id": 32,
            "name": "Минский филиал РУП \"Белтаможсервис\"",
            "unp": "101561144"
          }
  - name: default Response
    description: Ошибка выполнения запроса (см. раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/users/addTruster"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }
