info:
  name: Список Доверителей
  type: http
  seq: 3
  tags:
    - Авторизация и делегирование

http:
  method: POST
  url: "{{baseUrl}}/principalList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень Доверителей
    request:
      url: "{{baseUrl}}/principalList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "principal_list": [
              {
                "address": "г. Минск,ул. Тимирязева, д.2, ком. 16",
                "gln": "4811612900000",
                "id": 129,
                "name": "СООО \"Свиток\"",
                "unp": "190704463"
              },
              {
                "address": "аг. Озерцо, ул Гладкая, д 11",
                "gln": "4819535310005",
                "id": 13282,
                "name": "ИП Козлов Ю.И.",
                "unp": "190989751"
              }
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса (см. раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/principalList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Список Доверителей, от имени и по поручению которых Поверенный может осуществлять операции в ГИС «Электронный знак» при наличии действующей записи в реестре поручений. Входные параметры отсутствуют. Примечание из документа: «В заголовке HTTP-запроса (Headers) параметр Token не используется»."
