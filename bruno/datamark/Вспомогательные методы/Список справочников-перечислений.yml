info:
  name: Список справочников-перечислений
  type: http
  seq: 1
  tags:
    - Вспомогательные методы

http:
  method: POST
  url: "{{baseUrl}}/directories/"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень справочников-перечислений
    request:
      url: "{{baseUrl}}/directories/"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "directories": [
              {
                "code": "country",
                "comment": "",
                "count": 251,
                "name": "Страны"
              },
              {
                "code": "currency",
                "comment": "",
                "count": 5,
                "name": "Валюты"
              },
              {
                "code": "shippingDocs",
                "comment": "Документы прилагаемые к...",
                "count": 16,
                "name": "Тип документов"
              }
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса (см. раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/directories/"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Перечень справочников-перечислений ГИС «Электронный знак». Входные параметры в документе не указаны.
