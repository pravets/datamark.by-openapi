info:
  name: Список типографий
  type: http
  seq: 4
  tags:
    - Вспомогательные методы

http:
  method: POST
  url: "{{baseUrl}}/users/typographyList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень типографий
    request:
      url: "{{baseUrl}}/users/typographyList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "typography_list": [
              {
                "address": "г. Минск",
                "country": {
                  "code": "112",
                  "comment": null,
                  "name": "Беларусь"
                },
