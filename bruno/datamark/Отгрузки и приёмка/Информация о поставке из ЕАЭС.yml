docs: Метод «Информация о поставке из ЕАЭС» (п. 3.7.10). Возвращает сведения о поставке (объект класса Import, см. п. 4.1.10) по её уникальному идентификатору. При details = true дополнительно выводятся детальные сведения о результате обработки по каждому коду идентификации (массив labels возвращается в виде массива объектов с результатом обработки каждого кода).
