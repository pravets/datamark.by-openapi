docs: Метод «Список отгрузок» (п. 3.7.5.1, Представление А), контекст грузоотправителя (отгрузка). Возвращает перечень отгрузок за интервал дат с фильтрами; сведения об отгрузках — объекты класса Ship (см. п. 4.1.7).
