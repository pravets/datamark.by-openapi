info:
  name: Список отгруженных кодов
  type: http
  seq: 10
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/ships/labels"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень отгруженных КА и КМ
    request:
      url: "{{baseUrl}}/ships/labels"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "aggregates": [
              {
                "label": 48116129000000530,
                "parent": "",
                "status": {
                  "code": 30,
                  "message": "Валидирован"
                }
              },
              {
                "label": "0004819018880000002502048113090167243761320111230987zyx",
                "parent": 48116129000000530,
                "status": {
                  "code": 30,
                  "message": "Валидирован"
                }
              }
            ],
            "labels": [
              {
                "label": "0104810268018930212Z6rhrpa\\u001d93Y!&m",
                "parent": "000481901888000000250204811309016724376\\u001d1320111230123abc",
                "snomer": null,
                "status": {
                  "code": 50,
