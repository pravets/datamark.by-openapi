docs: Метод «Список поставок из ЕАЭС» (п. 3.7.8). Возвращает перечень поставок (трансграничных отгрузок), поступивших из государств-членов ЕАЭС, за указанный интервал дат с учётом отборов (фильтров). Ответ содержит общее количество поставок в выборке (count) и массив сведений о поставках (shipments_list) — объекты класса Import (см. п. 4.1.10).
