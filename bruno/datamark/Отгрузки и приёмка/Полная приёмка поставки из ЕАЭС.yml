docs: Метод «Полная приёмка поставки из ЕАЭС» (п. 3.7.14). Выполняет полную приёмку поставки с типом поставки type = ship по уникальному идентификатору документа. В ответе возвращаются сведения о принятой поставке (объект класса Import, см. п. 4.1.10).
