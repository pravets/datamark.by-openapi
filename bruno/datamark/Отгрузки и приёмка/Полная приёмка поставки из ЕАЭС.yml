info:
  name: Полная приёмка поставки из ЕАЭС
  type: http
  seq: 7
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/ships/import/takeAll"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Сведения о принятой поставке. Объект класса Import (см. п. 4.1.10)
    request:
      url: "{{baseUrl}}/ships/import/takeAll"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "created_at": "2025-09-18 14:15:44+03",
            "document_date": "2025-09-18",
            "document_id": "RU-UECB00000000000000000169-0003",
