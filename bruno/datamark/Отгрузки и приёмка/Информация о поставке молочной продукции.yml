docs: "Метод «Информация о поставке молочной продукции» (п. 3.7.11). Возвращает сведения о поставке молочной продукции (объект класса Ship, см. п. 4.1.7). Вариант 1 — для поставки молочной продукции на экспорт (operation = export): передаётся параметр code (номер поставки). Вариант 2 — для поставки молочной продукции по импорту (operation = import): передаётся параметр document_id (уникальный идентификатор документа)."
