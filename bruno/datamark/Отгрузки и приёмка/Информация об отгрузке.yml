info:
  name: Информация об отгрузке
  type: http
  seq: 15
  tags:
    - Отгрузки и приёмка

http:
  method: GET
  url: "{{baseUrl}}/ships/:code"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: code
      value: "4355"
      type: path
      description: Номер отгрузки. ID отгрузки, полученный из методов /ships/add (см. п. 3.7.1.1), /ships/list или /ships/shipped (см. п. 3.7.5.1)
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

