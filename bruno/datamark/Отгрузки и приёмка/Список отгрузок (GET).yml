docs: Метод «Список отгрузок» (п. 3.7.5.2, Представление Б, версия v3), контекст грузополучателя (приёмка). Возвращает постраничный перечень поступивших отгрузок с отборами (фильтрами); сведения об отгрузках — объекты класса Ship (см. п. 4.1.7).
