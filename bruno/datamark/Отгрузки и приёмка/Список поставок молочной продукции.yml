info:
  name: Список поставок молочной продукции
  type: http
  seq: 5
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/ships/gtinList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Перечень поставок молочной продукции с учётом отборов (фильтров)
    request:
      url: "{{baseUrl}}/ships/gtinList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "count": 6,
            "ships_list": [
              {
                "comment": "Поставка по заказу N 9848 от 14.05.2021",
                "created_at": "2021-05-28 16:07:14+03",
                "name": "НД0294125",
                "price": {
                  "price": "2050.75"
                }
              }
            ]
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/ships/gtinList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод «Список поставок молочной продукции» (п. 3.7.7). Возвращает перечень поставок молочной продукции за интервал дат по виду операции; сведения о поставках — объекты класса Ship (см. п. 4.1.7).
