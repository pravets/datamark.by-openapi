info:
  name: Оприходование кодов (POST)
  type: http
  seq: 20
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/v3/ships/take"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат запуска приёмки
    request:
      url: "{{baseUrl}}/v3/ships/take"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "detail": "Приемка начата",
            "ship_id": 2000040045
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/ships/take"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: 'Метод «Оприходование кодов» (п. 3.7.4.2, Представление Б, версия v3). Запрос должен обязательно содержать хотя бы один из параметров, в которых перечислены принимаемые коды ("labels" для КМ либо "aggregates" для КА), или указан пустой массив, если соответствующие коды отклоняются в полном объёме. Выполняется однократно. В массивах перечисляются фактически принятые коды. Возможна частичная приёмка: все непринятые коды автоматически возвращаются грузоотправителю. Если массив не заполнен, вся отгрузка в части КМ или КА соответственно будет отклонена.'
