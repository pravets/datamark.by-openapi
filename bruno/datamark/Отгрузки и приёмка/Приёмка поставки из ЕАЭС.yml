docs: Метод «Приёмка поставки из ЕАЭС» (п. 3.7.9). Выполняет приёмку кодов идентификации, переданных при трансграничной отгрузке (поставке) из государства-члена ЕАЭС. Доверительная приёмка выполняется на основе документа трансграничной отгрузки (type = ship) либо документа с типом поставки type = export. Если массив labels не заполнен, вся поставка будет отклонена, а переданные в ней коды будут автоматически возвращены грузоотправителю.
