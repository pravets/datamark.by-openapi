docs: Метод «Список отгрузок» (п. 3.7.5.2, Представление Б, версия v3), контекст грузоотправителя (отгрузка). Возвращает постраничный перечень отгрузок с отборами (фильтрами); сведения об отгрузках — объекты класса Ship (см. п. 4.1.7).
