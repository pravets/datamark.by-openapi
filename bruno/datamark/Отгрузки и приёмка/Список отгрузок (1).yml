info:
  name: Список отгрузок (1)
  type: http
  seq: 19
  tags:
    - Отгрузки и приёмка

http:
  method: GET
  url: "{{baseUrl}}/v3/ships/shipped"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: page
      value: "1"
      type: query
      description: Номер страницы перечня отгрузок
    - name: page_size
      value: "15"
      type: query
      description: Число записей на странице. Максимум — до 200, по умолчанию — до 15 на 1 страницу
    - name: ordering
      value: created_at
      type: query
      description: "Условия сортировки данных: created_at — по возрастанию даты и времени создания; -created_at — по убыванию даты и времени создания; id — по возрастанию номера (идентификатора) отгрузки; -id — по убыванию номера (идентификатора) отгрузки"
      disabled: true
    - name: ordering
      value: -created_at
      type: query
      description: "Условия сортировки данных: created_at — по возрастанию даты и времени создания; -created_at — по убыванию даты и времени создания; id — по возрастанию номера (идентификатора) отгрузки; -id — по убыванию номера (идентификатора) отгрузки"
      disabled: true
    - name: ordering
      value: id
      type: query
      description: "Условия сортировки данных: created_at — по возрастанию даты и времени создания; -created_at — по убыванию даты и времени создания; id — по возрастанию номера (идентификатора) отгрузки; -id — по убыванию номера (идентификатора) отгрузки"
      disabled: true
    - name: ordering
      value: -id
      type: query
      description: "Условия сортировки данных: created_at — по возрастанию даты и времени создания; -created_at — по убыванию даты и времени создания; id — по возрастанию номера (идентификатора) отгрузки; -id — по убыванию номера (идентификатора) отгрузки"
      disabled: true
    - name: start_date
      value: ""
      type: query
      description: "Начальная дата создания отгрузки. Формат: YYYY-MM-DD"
      disabled: true
    - name: end_date
      value: ""
      type: query
      description: "Конечная дата создания отгрузки. Формат: YYYY-MM-DD"
      disabled: true
    - name: nomer_tn
      value: ""
      type: query
      description: Номер сопроводительного документа, может также включать серию
      disabled: true
    - name: country
      value: ""
      type: query
      description: Цифровой код страны. Код значения перечисления country, полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.1)
      disabled: true
    - name: agent
      value: ""
      type: query
      description: ID контрагента-грузополучателя, в адрес которого осуществляется отгрузка. Указывается значение реквизита id объекта класса Agent (см. п. 4.1.2)
      disabled: true
    - name: start_operation_date
      value: ""
      type: query
      description: "Начальная дата отгрузки по сопроводительному документу. Формат: YYYY-MM-DD"
      disabled: true
    - name: end_operation_date
      value: ""
      type: query
      description: "Конечная дата отгрузки по сопроводительному документу. Формат: YYYY-MM-DD"
      disabled: true
    - name: start_received_date
      value: ""
      type: query
      description: "Начальная дата приёмки. Формат: YYYY-MM-DD"
      disabled: true
    - name: end_received_date
      value: ""
      type: query
      description: "Конечная дата приёмки. Формат: YYYY-MM-DD"
      disabled: true
    - name: currency
      value: ""
      type: query
      description: Валюта отгрузки. Код значения перечисления currency, полученного методом /directories/{:code} (см. п. 3.8.3; перечень значений приведен таблице 4.3.2)
      disabled: true
    - name: status
      value: ""
      type: query
      description: Код (идентификатор) статуса отгрузки (перечень значений приведен таблице 4.2.6.2)
      disabled: true
    - name: group
      value: ""
      type: query
      description: Товарная группа (перечень значений приведен таблице 4.2.1.2)
      disabled: true
    - name: search
      value: ""
      type: query
      description: Номер отгрузки. ID отгрузки, по которому осуществляется поиск в списке
      disabled: true
    - name: cancel_by_admin
      value: ""
      type: query
      description: "Признак выполнения операции отмены: False — отгрузка отклонена грузополучателем; True — отгрузка отменена Оператором"
      disabled: true
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

