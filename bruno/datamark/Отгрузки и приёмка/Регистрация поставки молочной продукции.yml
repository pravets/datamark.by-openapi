info:
  name: Регистрация поставки молочной продукции
  type: http
  seq: 4
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/ships/gtin"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

