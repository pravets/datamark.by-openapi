docs: "Метод «Регистрация поставки молочной продукции» (п. 3.7.6). Используется только для передачи сведений о поставке (отгрузке) товаров из группы «Молочная продукция» (group = milk) в Российскую Федерацию в рамках объёмно-сортового учёта, а также импорта из Российской Федерации. Обязательность параметров shipping_doc, document_id, nomer_tn, country, agent, currency, operation_date зависит от вида операции (operation): при operation = export обязательны shipping_doc, nomer_tn, country, agent, currency, operation_date; при operation = import обязателен document_id (если сведения о поставке переданы экспортёром и получены в ГИС «Электронный знак»)."
