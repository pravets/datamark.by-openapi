info:
  name: Список отгруженных кодов (POST)
  type: http
  seq: 17
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/v3/ships/downloads"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Вариант 1. Сведения о кодах найдены
    request:
      url: "{{baseUrl}}/v3/ships/downloads"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "codes": [
              "0105201409805158215cFp<eKzEGR;f\\u001d91FFD0\\u001d92dGVzdI3PoF8ZiWLNWu55wIx04qjEU+aAdiMeEo7s2hE="
            ],
            "file_type": "labels_sent",
            "ship_id": 2000040045
          }
  - name: Вариант 2. Запрашиваемые сведения о кодах отсутствуют
    request:
      url: "{{baseUrl}}/v3/ships/downloads"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "detail": "файл не найден",
            "file_type": "labels_taken",
            "ship_id": 2000040045
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/ships/downloads"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: 'Метод «Список отгруженных кодов» (п. 3.7.3.2, Представление Б, версия v3). Возвращает перечень кодов (КМ или КА) отгрузки запрошенного типа. Варианты ответа: 1) сведения о кодах найдены — возвращается массив codes; 2) запрашиваемые сведения о кодах отсутствуют — возвращается сообщение detail ("файл не найден").'
