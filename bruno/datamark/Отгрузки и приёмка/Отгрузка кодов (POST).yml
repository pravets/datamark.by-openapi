info:
  name: Отгрузка кодов (POST)
  type: http
  seq: 16
  tags:
    - Отгрузки и приёмка

http:
  method: POST
  url: "{{baseUrl}}/v3/ships/add"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат регистрации отгрузки
    request:
      url: "{{baseUrl}}/v3/ships/add"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "ship_id": 2000040067
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v3/ships/add"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: 'Метод «Отгрузка кодов» (п. 3.7.1.2, Представление Б, версия v3). Регистрирует отгрузку кодов маркировки (КМ) или кодов агрегации (КА). Запрос должен обязательно содержать хотя бы один из параметров, в которых перечислены коды: "labels" для КМ либо "aggregates" для КА. Ограничения: КМ должны принадлежать одной товарной группе; КА не должен быть «пустым»; КА (в том числе вложенные) должны содержать КМ одной товарной группы; суммарное количество КМ на 1 отгрузку: при отгрузке в страны ЕАЭС — не более 30 000 кодов, в остальных случаях — не более 100 000 кодов; при отгрузке за пределы Республики Беларусь КА не передаются (только КМ в массиве labels).'
