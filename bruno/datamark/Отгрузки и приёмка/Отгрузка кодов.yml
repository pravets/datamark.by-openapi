info:
  name: Отгрузка кодов
  type: http
  seq: 1
  tags:
    - Отгрузки и приёмка

http:
  method: PUT
  url: "{{baseUrl}}/ships/add"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат регистрации отгрузки
    request:
      url: "{{baseUrl}}/ships/add"
      method: PUT
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "message": "#4355 успешно создана.",
            "ship": 4355
          }
  - name: default Response
    description: Ошибка запроса. Коды ошибок и их описание приведены в таблице 5 (раздел 5 «Коды ошибок и их описание») Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/ships/add"
      method: PUT
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Метод «Отгрузка кодов» (п. 3.7.1.1, Представление А). Регистрирует отгрузку кодов маркировки (КМ) или кодов агрегации (КА) в адрес контрагента-грузополучателя. Ограничения по массиву labels: 1) КМ должны принадлежать одной товарной группе; 2) КМ не должен входить в состав другого агрегата; 3) КА не должен быть «пустым»; 4) КА не должен входить в состав агрегата верхнего уровня; 5) нельзя одновременно указывать КМ и КА; 6) суммарное количество КМ на 1 отгрузку: при отгрузке в страны ЕАЭС — не более 30 000 кодов, в остальных случаях — не более 100 000 кодов; 7) при отгрузке за пределы Республики Беларусь передаются только КМ (КА не передаются)."
