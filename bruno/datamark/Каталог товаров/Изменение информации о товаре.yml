info:
  name: Изменение информации о товаре
  type: http
  seq: 5
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/items/edit"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Ответ содержит описание товара с внесенными изменениями и дополнениями. Пример тела ответа в документе не приведён
    request:
      url: "{{baseUrl}}/items/edit"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "item": {
              "articul": "",
              "code": "100950000583470",
              "description": "",
              "group": "ukz",
              "gtin": null,
              "gtin_check": false,
              "image": "https://s3.datamark.by/catalogs_sand/876-1624961963-e3dd0388a6c7fd03f318330176abdec7.jpg",
              "is_my": false,
              "name": "Икра; консервы рыбные (ТН ВЭД ЕАЭС из 1604)",
              "params": []
            }
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/items/edit"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Примечание: метод используется только для добавления или изменения (обновления) изображения товара."
