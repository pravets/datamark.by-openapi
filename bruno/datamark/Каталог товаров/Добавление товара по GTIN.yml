info:
  name: Добавление товара по GTIN
  type: http
  seq: 3
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/items/addByGtin"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Описание добавленного товара. Объект класса Item (см. п. 4.1.4)
    request:
      url: "{{baseUrl}}/items/addByGtin"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
