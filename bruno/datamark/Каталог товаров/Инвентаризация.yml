info:
  name: Инвентаризация
  type: http
  seq: 7
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/v2/items/inventory"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Инвентаризационная опись. Объект класса Inventory (см. п. 4.1.9)
    request:
      url: "{{baseUrl}}/v2/items/inventory"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "created_at": "2021-11-01 09:37:01+03",
            "date": "2021-11-01",
            "document_id": "37faa56c-484d-498e-b9f8-cdf7508e9658",
            "group": "shoes",
            "id": "1259835",
            "name": "124",
            "quantity": 3200,
            "status": {
              "code": 1,
              "message": "Зарегистрирован"
            }
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/items/inventory"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: "Примечание: применение метода возможно только с даты введения обязательной маркировки и становится недоступным после окончания периода времени передачи информации о проведении инвентаризации остатков товаров, установленного для соответствующей товарной группы."
