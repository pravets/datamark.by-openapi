                  }
                ],
                "tnved": "4011100009"
              }
            ]
          }
  - name: Вариант 2. Поиск по импортированным товарам (is_import = True). Массив params сокращён
    request:
      url: "{{baseUrl}}/items/findItems"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "items": [
