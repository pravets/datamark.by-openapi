info:
  name: Поиск товара
  type: http
  seq: 6
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/items/findItems"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Вариант 1. Поиск по умолчанию (is_import = False или не указан). Массив params сокращён (в документе ~25 элементов)
    request:
      url: "{{baseUrl}}/items/findItems"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "items": [
              {
                "articul": "BEL-295",
                "catalog": {
                  "code": 10086,
                  "name": "Шины и покрышки"
                },
                "code": "100860000494400",
                "debug_message": {
                  "gtin": "4811644004509",
                  "status_code": "1",
                  "status_message": "Товар успешно зарегистрирован"
                },
                "description": "Шина пневматическая  для легковых автомобилей Белшина 225/65R17   BEL-295   102H  БЕСКАМЕРНЫЕ   ЛЕТНИЕ ШИНЫ",
                "document_id": null,
                "group": "tires",
                "gtin": 4811644004509,
                "gtin_check": true,
                "image": "https://s3.datamark.by/catalogs/404.jpg",
