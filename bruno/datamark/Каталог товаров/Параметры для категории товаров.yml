info:
  name: Параметры для категории товаров
  type: http
  seq: 2
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/catalogs/:code"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  params:
    - name: code
      value: "10089"
      type: path
      description: Код (идентификатор) раздела каталога (категории) товара, полученный из метода /catalogs/ (см. п. 3.2.1; перечень значений приведен таблице 4.1.3.2)
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

