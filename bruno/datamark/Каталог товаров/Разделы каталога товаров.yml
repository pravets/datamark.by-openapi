info:
  name: Разделы каталога товаров
  type: http
  seq: 1
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/catalogs/"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Успешный ответ — массив с иерархической структурой (деревом) разделов каталога (категорий) товаров
    request:
      url: "{{baseUrl}}/catalogs/"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "catalogs": [
              {
                "code": 10002,
                "group": {
                  "articul_required": true,
                  "code": "shoes",
                  "gtin_required": true,
                  "is_gtin_add": true,
                  "is_manually_add": false,
                  "is_show_articul": true,
                  "is_show_gtin": true,
                  "name": "Обувь"
                },
                "name": "Обувь"
              },
              {
                "code": 10081,
                "group": {
                  "articul_required": true,
                  "code": "clothes",
                  "gtin_required": true,
                  "is_gtin_add": true,
                  "is_manually_add": false,
                  "is_show_articul": true,
                  "is_show_gtin": true,
                  "name": "Легкая промышленность"
                },
                "inner": [
                  {
                    "code": 10082,
                    "group": {
                      "articul_required": true,
                      "code": "clothes",
                      "gtin_required": true,
                      "is_gtin_add": true,
                      "is_manually_add": false,
                      "is_show_articul": true,
                      "is_show_gtin": true,
                      "name": "Легкая промышленность"
                    },
                    "name": "Белье постельное, столовое, туалетное и кухонное"
                  }
                ],
                "name": "Легкая промышленность"
              }
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/catalogs/"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }

docs: Метод возвращает иерархическую структуру (дерево) разделов каталога (категорий) товаров. Входные параметры отсутствуют.
