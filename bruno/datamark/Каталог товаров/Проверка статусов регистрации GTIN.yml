info:
  name: Проверка статусов регистрации GTIN
  type: http
  seq: 4
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/items/checkGtin"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результаты проверки по каждому переданному значению GTIN. Имя ключа элемента соответствует GTIN, значение элемента содержит результат проверки либо описание ошибок
    request:
      url: "{{baseUrl}}/items/checkGtin"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "4810347004489": {
              "gtin_check": true
            },
            "4810347004960": {
              "gtin_check": false
            },
            "8430854527934": {
              "error": 404,
              "message": "Not found"
            }
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/items/checkGtin"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }
