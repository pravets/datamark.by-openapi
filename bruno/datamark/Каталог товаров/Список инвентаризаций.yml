info:
  name: Список инвентаризаций
  type: http
  seq: 8
  tags:
    - Каталог товаров

http:
  method: POST
  url: "{{baseUrl}}/v2/items/inventoryList"
  headers:
    - name: Token
      value: "{{apiKey}}"
      description: Токен авторизации, возвращаемый методом /auth
  auth:
    type: apikey
    key: Token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Сведения об инвентаризационных описях с общим количеством записей в выборке
    request:
      url: "{{baseUrl}}/v2/items/inventoryList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "count": 6,
            "inventories_list": [
              {
                "created_at": "2021-11-01 09:37:01+03",
                "date": "2021-11-01",
                "document_id": "37faa56c-484d-498e-b9f8-cdf7508e9658",
                "group": "shoes",
                "id": "1259835",
                "name": "124",
                "quantity": 3200,
                "status": {
                  "code": 1,
                  "message": "Зарегистрирован"
                }
              },
              {
                "created_at": "2021-11-01 09:36:32+03",
                "date": "2021-11-01",
                "document_id": "16a9c5d7-46d5-4d03-855f-6f6dcfacbe99",
                "group": "shoes",
                "id": "1259834",
                "name": "123",
                "quantity": 1875,
                "status": {
                  "code": 1,
                  "message": "Зарегистрирован"
                }
              }
            ]
          }
  - name: default Response
    description: Ошибка выполнения запроса Ошибка выполнения запроса (HTTP 4XX). Тело ответа — единая схема ErrorResponse.
    request:
      url: "{{baseUrl}}/v2/items/inventoryList"
      method: POST
      headers:
        - name: Token
          value: "{{apiKey}}"
          description: Токен авторизации, возвращаемый методом /auth
    response:
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: text
        data: |-
          {
            "details": [
              "Field ... must be ..."
            ],
            "error": 400,
            "message": "Input parameters validation error"
          }
